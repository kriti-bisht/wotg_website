<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wisdom on the Go · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night:   #16202e;
      --night2:  #1e2d40;
      --night3:  #243349;
      --grey1:   #f0f2f5;
      --grey2:   #b8c0cc;
      --grey3:   #6b7685;
      --white:   #ffffff;
      --green:   #3ab54a;
      --green2:  #2d9640;
      --border:  rgba(255,255,255,0.09);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(160deg, #0d1825 0%, #16202e 40%, #1a2535 70%, #0f1b2a 100%);
      background-attachment: fixed;
      color: var(--grey1);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(22,32,46,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .logo-block { display: flex; flex-direction: column; gap: 0; }
    .logo-text { font-size: 1.5rem; color: var(--white); }
    .logo-w { font-weight: 700; }
    .logo-mid { font-weight: 400; }
    .logo-go { font-weight: 700; color: var(--green); }
    .logo-sanskrit {
      font-size: 0.62rem; font-weight: 300; letter-spacing: 0.16em;
      color: var(--white); opacity: 0.75; padding-left: 0.1rem; margin-top: -0.15rem;
    }

    /* PAGE LAYOUT */
    .page-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(30,45,64,0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2.5rem 2.5rem 2rem;
      backdrop-filter: blur(12px);
    }
    .card-eyebrow {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 1rem;
    }
    .card h1 {
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--white);
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }
    .card h1 em {
      font-style: normal;
      font-weight: 600;
      color: var(--green);
    }
    .card-sub {
      font-size: 0.88rem;
      color: var(--grey2);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* FORM */
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey2);
      margin-bottom: 0.45rem;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7rem 1rem;
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: 0.94rem;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: var(--grey3); }
    input:focus { border-color: rgba(58,181,74,0.5); }

    /* BUTTON */
    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      background: var(--green);
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover { background: var(--green2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ERROR */
    .error-msg {
      display: none;
      font-size: 0.78rem;
      color: #e05c5c;
      margin-top: 1rem;
      text-align: center;
    }

    /* FOOTER NOTE */
    .card-note {
      margin-top: 1.5rem;
      font-size: 0.72rem;
      color: var(--grey3);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo-block">
      <div class="logo-text">
        <span class="logo-w">W</span><span class="logo-mid">isdom on the </span><span class="logo-go">GO!</span>
      </div>
      <div class="logo-sanskrit">Tat Tvam Asi</div>
    </div>
  </nav>

  <div class="page-center">
    <div class="card">
      <p class="card-eyebrow">User Testing · Beta</p>
      <h1>Let's get <em>started.</em></h1>
      <p class="card-sub">Tell us a little about yourself before we begin the session.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="e.g. Jane" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" required />
        </div>
        <div class="form-group">
          <label for="company">Company / Organisation</label>
          <input type="text" id="company" placeholder="e.g. Acme Corp" required />
        </div>

        <button type="submit" class="btn" id="submitBtn">Start My Session →</button>
        <p class="error-msg" id="errorMsg">Something went wrong. Please try again.</p>
      </form>

      <p class="card-note">Your information is used only for this testing session and is not shared.</p>
    </div>
  </div>

  <script>
    const N8N_REGISTER_URL = 'https://wotg-n8n.happyglacier-b2985dc5.eastus.azurecontainerapps.io/webhook/register-user';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.textContent = 'Starting session...';
      errorMsg.style.display = 'none';

      const sessionId = crypto.randomUUID();
      const name      = document.getElementById('name').value.trim().replace(/\b\w/g, c => c.toUpperCase());
      const email     = document.getElementById('email').value.trim();
      const company   = document.getElementById('company').value.trim();
      const timestamp = new Date().toISOString();

      localStorage.setItem('session_id',   sessionId);
      localStorage.setItem('user_name',    name);
      localStorage.setItem('user_email',   email);
      localStorage.setItem('user_company', company);

      try {
        await fetch(N8N_REGISTER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, user_name: name, user_email: email, user_company: company, timestamp })
        });

        window.location.href = 'chat.html';
      } catch (err) {
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Start My Session →';
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wisdom on the Go — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --night:   #041A40;
  --night2:  #2A3C5D;
  --night3:  #4F5F79;
  --grey1:   #f0f2f5;
  --grey2:   #b8c0cc;
  --grey3:   #6b7685;
  --white:   #ffffff;
  --green:   #3ab54a;
  --green2:  #2d9640;
  --gold:    #E4CA0A;
  --gold2:   #AB9808;
  --amber:   #e8960a;
  --amber2:  #c17d00;
  --red:     #e0303a;
  --teal:    #14B8A6;
  --rose:    #E85D8A;   /* the Key Insights star badge (Fable's colour) -- was undefined here, so the badge drew blank (2026-10-09) */
  --blue:    #4A6FA5;   /* the Key Insights bullet dots: the same duller steel blue as Knowledge & Skill Application */
  --line:    rgba(4,26,64,0.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(4,26,64,0.06), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(228,202,10,0.05), transparent 40%),
    #fbfbfd;
  min-height:100vh; color:var(--night);
}
a { text-decoration:none; color:inherit; }
button { font-family:'Poppins',sans-serif; }
.hidden { display:none !important; }

/* ---- Layout ---- */
.admin-shell { min-height:100vh; }
.admin-sidebar {
  position:fixed; top:72px; left:0; width:240px; height:calc(100vh - 72px); z-index:100;
  background:var(--night); color:#fff; display:flex; flex-direction:column;
  transform:translateX(0); transition:transform 0.25s; box-shadow:4px 0 24px rgba(0,0,0,0.18);
}
.admin-sidebar.collapsed { transform:translateX(-100%); }
.admin-nav { flex:1; padding:0.6rem 0; overflow-y:auto; }
.admin-nav-item {
  display:flex; align-items:center; gap:0.65rem; width:100%; padding:0.7rem 1rem;
  color:var(--grey1); font-size:0.82rem; border-left:3px solid transparent; cursor:pointer;
  white-space:nowrap; transition:background 0.15s, border-color 0.15s; background:none; border-top:none; border-right:none; border-bottom:none; text-align:left;
}
.admin-nav-item svg { width:17px; height:17px; flex-shrink:0; }
.admin-nav-item:hover { background:rgba(255,255,255,0.06); border-left-color:var(--green); }
.admin-nav-item.active { background:rgba(255,255,255,0.08); border-left-color:var(--green); color:#fff; font-weight:600; }
.admin-nav-item .soon { font-size:0.55rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--night); background:var(--gold); border-radius:6px; padding:0.1rem 0.4rem; margin-left:auto; }
.admin-nav-divider { height:1px; background:rgba(255,255,255,0.1); margin:0.6rem 1rem; }
.admin-main { min-width:0; margin-left:240px; transition:margin-left 0.25s; }
.admin-main.expanded { margin-left:0; }
/* ---- Top banner: the same look, size and feel as the user side (chat.html), full width and always visible ---- */
header.topbar { background:var(--night); position:sticky; top:0; z-index:110; }
.header-inner { max-width:1600px; margin:0 auto; display:flex; align-items:center; padding:0.8rem 2rem; }
.burger-btn {
  width:38px; height:38px; border-radius:8px; background:rgba(255,255,255,0.08);
  border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin-right:1.2rem; flex-shrink:0;
}
.burger-btn:hover { background:rgba(255,255,255,0.16); }
.burger-btn span { display:block; width:18px; height:2px; background:#fff; border-radius:2px; }
.burger-btn span + span { margin-top:4px; }
.logo-block { text-decoration:none; display:flex; flex-direction:column; gap:0; }
.logo { font-size:1.5rem; }
.logo .w { font-weight:700; color:#fff; }
.logo .mid { font-weight:400; color:#fff; }
.logo .go { font-weight:700; color:var(--green); }
.logo-sanskrit { font-size:0.62rem; font-weight:300; letter-spacing:0.16em; color:#fff; opacity:0.75; padding-left:0.1rem; margin-top:-0.15rem; }
.greeting { margin-left:2rem; }
.greeting .hello { font-weight:600; font-size:1.1rem; color:#fff; }
.greeting .hello .name { color:var(--green); }
.greeting .sub { color:var(--grey2); font-size:0.9rem; }
.header-spacer { flex:1; }
.admin-profile { display:flex; align-items:center; gap:0.7rem; }
/* The round placeholder where the profile photo will appear on its own -- deliberately empty (no letter). */
.admin-profile .avatar-lg { display:block; width:38px; height:38px; border-radius:50%; background:transparent; border:2px solid rgba(255,255,255,0.3); flex-shrink:0; overflow:hidden; cursor:pointer; transition:background 0.15s; }
.admin-profile .avatar-lg:hover { background:rgba(255,255,255,0.16); }
.admin-profile .avatar-lg img { width:100%; height:100%; object-fit:cover; display:none; }
.admin-profile .avatar-lg img.has-photo { display:block; }
/* The photo's drop-down: the SAME box as the user page's (chat.html .profile-dropdown) -- same size, gold accent rows, slide-in. */
.profile-wrap { position:relative; }
.profile-dropdown {
  position:absolute; top:48px; right:0; width:200px; z-index:500;
  background:var(--white); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.25);
  padding:0.4rem; display:none;
}
.profile-dropdown.open { display:block; animation:notifSlide 0.2s ease; }
.profile-dropdown a, .profile-dropdown button {
  display:block; width:100%; text-align:left; background:rgba(228,202,10,0.08);
  border:none; border-left:4px solid var(--gold);
  font-family:'Poppins',sans-serif; padding:0.65rem 0.8rem; border-radius:6px;
  font-size:0.83rem; color:var(--night2); text-decoration:none; cursor:pointer;
  margin-bottom:0.15rem;
}
.profile-dropdown a:last-child, .profile-dropdown button:last-child { margin-bottom:0; }
.profile-dropdown a:hover, .profile-dropdown button:hover { background:rgba(228,202,10,0.16); color:var(--night); }
@keyframes notifSlide { from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
.admin-profile-text .name { color:#fff; font-weight:600; font-size:0.92rem; }
.admin-profile-text .title { color:var(--grey2); font-size:0.76rem; }
.admin-content { max-width:1500px; margin:0 auto; padding:1.6rem 2rem 3rem; }
.footer-credit { text-align:center; font-size:0.7rem; color:var(--grey3); padding:0 1rem 1.6rem; }

/* ---- Page header + tabs ---- */
.um-page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap; }
.um-title { font-size:1.5rem; font-weight:700; color:var(--night); }
.um-sub { font-size:0.85rem; color:var(--grey3); margin-top:0.2rem; max-width:62ch; }
.tabs { display:flex; gap:0.3rem; border-bottom:1px solid var(--line); margin-bottom:1.3rem; flex-wrap:wrap; }
.tab { background:none; border:none; border-bottom:3px solid transparent; padding:0.7rem 1.1rem; font-size:0.86rem; font-weight:600; color:var(--grey3); cursor:pointer; display:flex; align-items:center; gap:0.45rem; }
.tab:hover { color:var(--night); }
.tab.active { color:var(--night); border-bottom-color:var(--green); }
.tab .soon { font-size:0.55rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--night); background:var(--gold); border-radius:6px; padding:0.1rem 0.4rem; }

/* ---- Buttons ---- */
.btn-primary-add { font-size:0.86rem; font-weight:600; color:#fff; background:var(--green); border:none; border-radius:22px; padding:0.65rem 1.4rem; cursor:pointer; flex-shrink:0; transition:background 0.15s, transform 0.15s; box-shadow:0 6px 16px rgba(58,181,74,0.3); }
.btn-primary-add:hover { background:var(--green2); transform:translateY(-2px); }
.btn-primary-add:disabled { background:var(--grey2); box-shadow:none; transform:none; cursor:not-allowed; }
.btn-outline { font-size:0.82rem; font-weight:600; color:var(--night2); background:var(--white); border:1.5px solid rgba(4,26,64,0.14); border-radius:20px; padding:0.5rem 1.05rem; cursor:pointer; display:inline-flex; align-items:center; gap:0.4rem; white-space:nowrap; transition:border-color 0.15s, color 0.15s; }
.btn-outline svg { width:14px; height:14px; }
.btn-outline:hover { border-color:var(--night2); color:var(--night); }
.btn-outline:disabled { opacity:0.45; cursor:not-allowed; }
.btn-danger { font-size:0.82rem; font-weight:600; color:#fff; background:var(--red); border:none; border-radius:20px; padding:0.55rem 1.2rem; cursor:pointer; }
.btn-danger:hover { background:#c4232d; }
.btn-danger:disabled { background:var(--grey2); cursor:not-allowed; }
.btn-link { background:none; border:none; color:var(--green2); font-weight:600; font-size:0.8rem; cursor:pointer; padding:0; }
.btn-link:hover { text-decoration:underline; }

/* ---- Stat cards ---- */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem; margin-bottom:1.4rem; }
.stat-card { background:var(--white); border-radius:12px; padding:1.15rem 1.3rem; display:flex; align-items:center; gap:0.9rem; box-shadow:0 6px 20px rgba(4,26,64,0.08); border:1px solid rgba(4,26,64,0.05); transition:transform 0.2s ease, box-shadow 0.2s ease; min-width:0; }
.stat-card:hover { transform:translateY(-5px); box-shadow:0 16px 30px rgba(4,26,64,0.16); }
.stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 8px rgba(0,0,0,0.12); color:#fff; }
.stat-icon svg { width:22px; height:22px; }
.stat-icon.teal { background:var(--teal); } .stat-icon.green { background:var(--green); } .stat-icon.gold { background:var(--gold); } .stat-icon.navy { background:var(--night2); }
.stat-body { min-width:0; }
.stat-num { font-size:1.5rem; font-weight:700; color:var(--night); line-height:1.1; white-space:nowrap; }
.stat-label { font-size:0.78rem; color:var(--grey3); margin-top:0.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ---- Filter bar ---- */
.filter-bar { display:flex; align-items:center; gap:0.8rem; background:var(--white); border-radius:12px; padding:0.9rem 1.2rem; margin-bottom:1.4rem; box-shadow:0 6px 20px rgba(4,26,64,0.08); flex-wrap:wrap; }
.um-search-wrap { position:relative; flex:1 1 260px; min-width:220px; }
.um-search-icon { position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--grey3); pointer-events:none; }
.um-search { width:100%; font-family:'Poppins',sans-serif; font-size:0.85rem; color:var(--night); background:var(--grey1); border:1px solid rgba(4,26,64,0.1); border-radius:20px; padding:0.55rem 1rem 0.55rem 2.3rem; }
.um-search:focus { outline:2px solid var(--green); }
.filter-select-wrap { position:relative; }
.filter-select { appearance:none; -webkit-appearance:none; font-family:'Poppins',sans-serif; background:var(--grey1); border:1px solid rgba(4,26,64,0.1); border-radius:20px; padding:0.5rem 2.1rem 0.5rem 1rem; font-size:0.85rem; color:var(--night); cursor:pointer; min-width:150px; }
.filter-select:focus { outline:2px solid var(--green); }
.filter-select-wrap::after { content:''; position:absolute; right:0.9rem; top:50%; width:8px; height:8px; border-right:2px solid var(--grey3); border-bottom:2px solid var(--grey3); transform:translateY(-65%) rotate(45deg); pointer-events:none; }
.um-bar-actions { display:flex; gap:0.6rem; margin-left:auto; flex-shrink:0; flex-wrap:wrap; }

/* ---- Table ---- */
.um-table-card { background:var(--white); border-radius:14px; box-shadow:0 6px 20px rgba(4,26,64,0.08); overflow:hidden; margin-bottom:1.4rem; }
.um-table-scroll { overflow-x:auto; }
.um-table { width:100%; border-collapse:collapse; min-width:860px; }
.um-table th { text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--grey3); font-weight:600; padding:0.95rem 1.2rem; border-bottom:1px solid rgba(4,26,64,0.08); white-space:nowrap; }
.um-table td { padding:0.8rem 1.2rem; font-size:0.85rem; color:var(--night2); border-bottom:1px solid rgba(4,26,64,0.06); vertical-align:middle; }
.um-table td.nowrap, .um-table th.nowrap { white-space:nowrap; }
.um-table tbody tr:hover { background:var(--grey1); }
.um-table tbody tr:last-child td { border-bottom:none; }
.um-table tbody tr.clickable { cursor:pointer; }
.um-user-cell { display:flex; align-items:center; gap:0.7rem; }
.avatar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.74rem; flex-shrink:0; }
.um-user-name { font-weight:600; color:var(--night); font-size:0.85rem; }
.um-user-email { font-size:0.74rem; color:var(--grey3); }
.empty-row { text-align:center; padding:2.4rem 1rem !important; color:var(--grey3); }
.badge { display:inline-flex; align-items:center; gap:0.35rem; font-size:0.68rem; font-weight:700; padding:0.24rem 0.68rem; border-radius:12px; white-space:nowrap; }
.badge-user { background:var(--grey1); color:var(--night2); }
.badge-manager { background:rgba(58,181,74,0.12); color:var(--green2); }
.badge-lnd { background:rgba(20,184,166,0.14); color:#0d8f81; }
.badge-admin { background:rgba(228,202,10,0.18); color:var(--gold2); }
.badge-company_admin { background:rgba(4,26,64,0.10); color:var(--night); }
.badge-super_admin { background:var(--night); color:var(--gold); }
.badge-warn { background:rgba(232,150,10,0.16); color:var(--amber2); }
.badge-ok { background:rgba(58,181,74,0.12); color:var(--green2); }
.badge-bad { background:rgba(224,48,58,0.1); color:var(--red); }
.chip { display:inline-block; font-size:0.72rem; font-weight:600; background:var(--grey1); color:var(--night2); border-radius:12px; padding:0.18rem 0.6rem; margin:0.12rem 0.2rem 0.12rem 0; }
.code-pill { font-family:ui-monospace,Menlo,monospace; font-size:0.78rem; font-weight:700; background:var(--grey1); border-radius:8px; padding:0.2rem 0.55rem; color:var(--night); }
.um-action-btn { width:30px; height:30px; border-radius:8px; border:none; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--grey3); transition:background 0.15s, color 0.15s; }
.um-action-btn svg { width:16px; height:16px; }
.um-action-btn:hover { background:var(--grey2); color:var(--night); }
.um-pagination { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.3rem; flex-wrap:wrap; gap:0.7rem; }
.um-pag-info { font-size:0.8rem; color:var(--grey3); }
.um-pag-controls { display:flex; gap:0.5rem; }
.pag-btn { font-size:0.8rem; font-weight:600; color:var(--night2); background:var(--grey1); border:none; border-radius:16px; padding:0.4rem 0.95rem; cursor:pointer; transition:background 0.15s; }
.pag-btn:hover { background:var(--grey2); }
.pag-btn:disabled { opacity:0.45; cursor:default; }
.menu { position:absolute; z-index:300; background:#fff; border-radius:12px; box-shadow:0 14px 36px rgba(4,26,64,0.22); padding:0.4rem; min-width:210px; border:1px solid var(--line); }
.menu button { display:block; width:100%; text-align:left; background:none; border:none; padding:0.55rem 0.8rem; font-size:0.82rem; color:var(--night2); border-radius:8px; cursor:pointer; }
.menu button:hover { background:var(--grey1); color:var(--night); }
.menu button:disabled { color:var(--grey2); cursor:not-allowed; background:none; }
.menu button.danger { color:var(--red); }
.menu .sep { height:1px; background:var(--line); margin:0.3rem 0; }

/* ---- Cards / panels ---- */
.panel { background:var(--white); border-radius:14px; box-shadow:0 6px 20px rgba(4,26,64,0.08); padding:1.4rem 1.5rem; margin-bottom:1.4rem; }
.panel h3 { font-size:1rem; font-weight:700; margin-bottom:0.25rem; }
.panel .hint { font-size:0.8rem; color:var(--grey3); margin-bottom:1rem; max-width:70ch; }
.banner { background:rgba(228,202,10,0.14); border:1px solid rgba(228,202,10,0.45); color:#6e6205; border-radius:12px; padding:0.8rem 1rem; font-size:0.82rem; margin-bottom:1.2rem; }
.banner.info { background:rgba(20,184,166,0.1); border-color:rgba(20,184,166,0.35); color:#0b6f65; }
.soon-card { text-align:center; padding:4rem 1rem; }
.soon-card .big { font-size:1.4rem; font-weight:700; margin-bottom:0.4rem; }
.soon-card p { color:var(--grey3); font-size:0.9rem; max-width:52ch; margin:0 auto; }

/* ---- Forms ---- */
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.9rem 1.1rem; }
.form-grid .full { grid-column:1 / -1; }
.field label { display:block; font-size:0.74rem; font-weight:600; color:var(--night2); margin-bottom:0.3rem; }
.field label .req { color:var(--red); }
.field .help { font-size:0.72rem; color:var(--grey3); margin-top:0.25rem; }
.field input[type=text], .field input[type=email], .field input[type=password], .field input[type=search], .field input[type=date], .field select, .field textarea, .input {
  width:100%; font-family:'Poppins',sans-serif; font-size:0.86rem; color:var(--night); background:#fff; border:1.5px solid rgba(4,26,64,0.16); border-radius:10px; padding:0.55rem 0.8rem;
}
.field textarea { resize:vertical; min-height:68px; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline:2px solid var(--green); border-color:transparent; }
.field input:disabled, .field select:disabled, .field textarea:disabled { background:var(--grey1); color:var(--grey3); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color:var(--red); }
.field .err { color:var(--red); font-size:0.72rem; margin-top:0.25rem; }
.radio-row { display:flex; gap:1.2rem; padding:0.35rem 0; font-size:0.86rem; }
.radio-row label { display:flex; align-items:center; gap:0.4rem; font-weight:500; margin:0; }
.check-list { border:1.5px solid rgba(4,26,64,0.16); border-radius:10px; max-height:170px; overflow:auto; padding:0.4rem 0.7rem; }
.check-list label { display:flex; align-items:center; gap:0.5rem; font-size:0.84rem; font-weight:500; padding:0.28rem 0; margin:0; }
.check-list .grp { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--grey3); font-weight:700; margin-top:0.35rem; }
.counter { font-size:0.7rem; color:var(--grey3); text-align:right; margin-top:0.2rem; }
.counter.over { color:var(--red); font-weight:700; }

/* ---- Combo (searchable dropdown) ---- */
.combo { position:relative; }
.combo-list { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:400; background:#fff; border-radius:10px; box-shadow:0 14px 36px rgba(4,26,64,0.22); border:1px solid var(--line); max-height:230px; overflow:auto; }
.combo-item { padding:0.5rem 0.8rem; font-size:0.84rem; cursor:pointer; }
.combo-item:hover, .combo-item.active { background:var(--grey1); }
.combo-item.free { color:var(--green2); font-weight:600; border-top:1px solid var(--line); }
.combo-empty { padding:0.6rem 0.8rem; font-size:0.8rem; color:var(--grey3); }

/* ---- Modal / toast ---- */
.modal-backdrop { position:fixed; inset:0; background:rgba(4,26,64,0.52); z-index:500; display:flex; align-items:flex-start; justify-content:center; padding:4vh 1rem; overflow-y:auto; }
.modal { background:#fff; border-radius:16px; width:100%; max-width:720px; box-shadow:0 30px 70px rgba(4,26,64,0.4); display:flex; flex-direction:column; max-height:92vh; }
.modal.narrow { max-width:520px; }
.modal.wide { max-width:980px; }
.modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; padding:1.2rem 1.5rem 0.4rem; }
.modal-head h2 { font-size:1.15rem; font-weight:700; }
.modal-head p { font-size:0.8rem; color:var(--grey3); margin-top:0.2rem; }
.modal-x { background:none; border:none; font-size:1.5rem; line-height:1; color:var(--grey3); cursor:pointer; padding:0 0.3rem; }
.modal-x:hover { color:var(--night); }
.modal-body { padding:0.8rem 1.5rem 1rem; overflow-y:auto; }
.modal-foot { display:flex; justify-content:flex-end; gap:0.7rem; padding:0.9rem 1.5rem 1.2rem; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center; }
.modal-foot .left { margin-right:auto; font-size:0.78rem; color:var(--grey3); }
.toast-root { position:fixed; right:1.2rem; bottom:1.2rem; z-index:900; display:flex; flex-direction:column; gap:0.6rem; }
.toast { background:var(--night); color:#fff; border-radius:12px; padding:0.8rem 1.1rem; font-size:0.84rem; box-shadow:0 14px 34px rgba(4,26,64,0.35); max-width:420px; border-left:5px solid var(--green); }
.toast.error { border-left-color:var(--red); }
.toast.warn { border-left-color:var(--amber); }
.result-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
.result-table th { text-align:left; font-size:0.66rem; text-transform:uppercase; color:var(--grey3); padding:0.5rem 0.6rem; border-bottom:1px solid var(--line); }
.result-table td { padding:0.5rem 0.6rem; border-bottom:1px solid rgba(4,26,64,0.06); vertical-align:top; }
.mono { font-family:ui-monospace,Menlo,monospace; }
.kv { display:grid; grid-template-columns:150px 1fr; gap:0.35rem 1rem; font-size:0.84rem; }
.kv dt { color:var(--grey3); font-weight:600; }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--grey2); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-block { text-align:center; padding:3rem 1rem; color:var(--grey3); font-size:0.88rem; }
.skill-pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:0.5rem; }
.skill-card { border:1.5px solid rgba(4,26,64,0.14); border-radius:10px; padding:0.55rem 0.8rem; font-size:0.82rem; cursor:pointer; background:#fff; text-align:left; }
.skill-card:hover { border-color:var(--green); }
.skill-card.sel { border-color:var(--green); background:rgba(58,181,74,0.08); }
.skill-card .cap { font-size:0.66rem; color:var(--grey3); text-transform:uppercase; letter-spacing:0.04em; }
.skill-card .nm { font-weight:600; color:var(--night); }
.glossary-cap { font-size:0.95rem; font-weight:700; margin:1.2rem 0 0.2rem; }
.glossary-def { font-size:0.8rem; color:var(--grey3); margin-bottom:0.6rem; max-width:90ch; }
.init-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }

@media (max-width: 960px) {
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  .form-grid { grid-template-columns:1fr; }
  .admin-main { margin-left:0; }
  .admin-sidebar { transform:translateX(-100%); }
  .admin-sidebar.open { transform:translateX(0); }
  .init-grid { grid-template-columns:1fr; }
  .um-bar-actions { margin-left:0; width:100%; flex-shrink:1; }
  .filter-select-wrap, .filter-select { width:100%; min-width:0; }
  .header-inner { padding:0.8rem 1rem; } .admin-content { padding:1.2rem 1rem 2.5rem; }
}

/* definition card under the skill picker, and removable chips (Skill Assignment Center / Initiative Builder) */
.def-box { background:var(--grey1); border:1px solid var(--line); border-radius:12px; padding:0.8rem 1rem; }
.def-title { font-weight:700; font-size:0.9rem; color:var(--night); }
.def-cap { font-weight:600; font-size:0.7rem; color:var(--grey3); margin-left:0.4rem; }
.def-text { font-size:0.84rem; color:var(--night2); margin-top:0.3rem; line-height:1.5; white-space:pre-line; }
.def-sub { font-size:0.72rem; color:var(--grey3); font-weight:600; margin:0.6rem 0 0.2rem; }
.chip-x { display:inline-flex; align-items:center; gap:0.3rem; padding-right:0.3rem; }
.chip-del { border:0; background:transparent; cursor:pointer; font-size:0.95rem; line-height:1; color:var(--grey3); padding:0 0.25rem; border-radius:50%; }
.chip-del:hover { color:var(--red); }

.help { font-size:0.74rem; color:var(--grey3); line-height:1.5; }
.help label { font-size:0.74rem; }

.btn-done, .btn-done:disabled { background:var(--green2) !important; color:#fff !important; border-color:transparent !important; opacity:1 !important; }
.btn-danger-outline { color:var(--red); border-color:rgba(224,48,58,0.45); }
.btn-danger-outline:hover:not(:disabled) { background:rgba(224,48,58,0.08); }
.btn-danger-outline:disabled { color:var(--grey3); border-color:var(--line); }

.limit-hint { font-size:0.68rem; color:var(--grey3); margin-top:0.22rem; line-height:1.3; }
.limit-hint.at { color:var(--red); }
.pp-filters { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.5rem; }
.pp-filters .filter-select { min-width:150px; max-width:260px; }
.bulk-note { font-size:0.78rem; color:var(--grey3); margin-top:0.4rem; }
.tagline { font-size:0.8rem; color:var(--night2); background:var(--grey1); border-radius:10px; padding:0.6rem 0.9rem; line-height:1.6; }
.hist-list { list-style:none; margin:0.5rem 0 0; padding:0; font-size:0.78rem; color:var(--night2); }
.hist-list li { padding:0.3rem 0; border-bottom:1px solid var(--line); }

/* ---- Adoption Overview ---- */
.adopt-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-bottom:1.4rem; }
/* Kriti, 2026-10-06, after the floating Fable-style bar wasn't what she wanted: "you have created that
   accent design in the observation [.adopt-insight, below] -- why can't you replicate it on the cards."
   Same technique exactly -- a flush border-left, not an inset floating bar -- night-sky instead of teal. */
.adopt-card { position:relative; background:var(--white); border-radius:14px; border-left:4px solid var(--night); padding:1.3rem 1.4rem; box-shadow:0 6px 20px rgba(4,26,64,0.08); border-top:1px solid rgba(4,26,64,0.05); border-right:1px solid rgba(4,26,64,0.05); border-bottom:1px solid rgba(4,26,64,0.05); cursor:pointer; text-align:left; transition:transform 0.2s ease, box-shadow 0.2s ease; display:block; width:100%; font-family:'Poppins',sans-serif; }
.adopt-card:hover { transform:translateY(-5px); box-shadow:0 16px 30px rgba(4,26,64,0.16); }
/* border-color isn't touched here (only the ring/glow shows "selected") -- the left accent stays night
   regardless of active state, so it never gets confused with the teal selection highlight. */
.adopt-card.active { box-shadow:0 0 0 2px var(--teal), 0 10px 24px rgba(20,184,166,0.18); }
.adopt-card-top { display:flex; align-items:center; gap:0.7rem; margin-bottom:0.9rem; }
.adopt-card-label { font-size:0.95rem; font-weight:700; color:var(--night); }
/* nowrap on the ROW means the caption can never drop to a whole new line below the number (Kriti,
   2026-10-06, after this recurred: "I want the sentence next to the number, not in the following line")
   -- min-width:0 lets the caption itself still wrap its OWN text onto a second line when it's long,
   but that second line stays in the caption's own column, beside the number, never under it. This also
   fixes the three cards' uneven alignment: a card with no data this period (a shorter caption, no "in
   October") used to end up a different height than its siblings once a LONGER caption on another card
   wrapped below its number -- with nowrap, every card's caption starts in the exact same place. */
.adopt-card-hero { display:flex; align-items:baseline; flex-wrap:nowrap; gap:0.35rem; }
.adopt-card-num { font-size:1.9rem; font-weight:700; color:var(--night); line-height:1.1; flex-shrink:0; }
.adopt-card-sub { font-size:0.82rem; color:var(--grey3); flex:1; min-width:0; }
/* Applied Learning's card shows two metrics, but the card itself can never grow past the other tabs'
   one-line size (Kriti, 2026-10-06: "you can't increase the size of the card... you have to reduce the
   font size" -- the card height is the fixed thing, the two numbers have to fit inside it, not the other
   way round). The icon row moves up a little to free up real room (only on this card -- "you don't need
   that room in the other tabs"), spent on bigger text for the two number lines rather than banked as
   whitespace -- tuned by direct measurement against the one-line card's own real height, not guessed. */
.adopt-card.two-metric { padding-top:1.05rem; }
.adopt-card.two-metric .adopt-card-top { margin-bottom:0.5rem; }
.adopt-card.two-metric .adopt-card-num { font-size:1.2rem; }
.adopt-card.two-metric .adopt-card-sub { font-size:0.72rem; line-height:1.15; }
.adopt-card.two-metric .adopt-card-hero2 { margin-top:0.15rem; }
.adopt-back { display:flex; align-items:center; gap:0.4rem; font-size:0.84rem; font-weight:600; color:var(--teal); background:none; border:none; cursor:pointer; margin-bottom:0.9rem; padding:0; }
.adopt-back:hover { color:#0d8f81; text-decoration:underline; }
.adopt-controls { display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; margin-bottom:1.2rem; }
.adopt-controls .filter-select-wrap { min-width:0; }
.adopt-seg { display:inline-flex; background:var(--grey1); border-radius:20px; padding:0.2rem; }
.adopt-seg button { font-size:0.8rem; font-weight:600; color:var(--night2); background:none; border:none; border-radius:16px; padding:0.4rem 0.85rem; cursor:pointer; }
.adopt-seg button.active { background:var(--night); color:#fff; }
.adopt-legend { display:flex; gap:1rem; font-size:0.76rem; color:var(--night2); flex-wrap:wrap; }
.adopt-legend span { display:inline-flex; align-items:center; gap:0.35rem; }
.adopt-legend i { width:9px; height:9px; border-radius:3px; display:inline-block; }
.adopt-newexisting { display:flex; gap:0.4rem; margin-top:0.7rem; }
.adopt-newexisting .seg { flex:1; height:10px; border-radius:5px; }
.adopt-newexisting .seg.new { background:var(--teal); }
.adopt-newexisting .seg.existing { background:var(--night); }

/* drag-and-drop: a card is draggable, the panel below is the drop target */
.adopt-card.dragging { opacity:0.4; }
.adopt-droptarget { transition:box-shadow 0.15s, background 0.15s; }
.adopt-droptarget.drag-over { box-shadow:0 0 0 2.5px var(--green) inset; background:rgba(58,181,74,0.04); }

/* the four tabs (Usage Hours / Learning Atoms / Applied Learning / Average Duration) -- one big chart
   at a time, never four tiles together (Kriti's explicit call, 2026-10-05) */
.adopt-tabs { display:flex; gap:0.3rem; border-bottom:1px solid var(--line); margin-bottom:1.2rem; flex-wrap:wrap; }
.adopt-tabs button { font-size:0.84rem; font-weight:600; color:var(--grey3); background:none; border:none; padding:0.7rem 1rem; cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.adopt-tabs button.active { color:var(--night); border-bottom-color:var(--teal); }
.adopt-tabs button:hover:not(.active) { color:var(--night2); }

.adopt-hero { display:flex; align-items:baseline; flex-wrap:wrap; gap:0.8rem; margin-bottom:0.5rem; }
.adopt-hero .num { font-size:2.4rem; font-weight:700; color:var(--night); line-height:1; }
.adopt-hero .unit { font-size:1rem; color:var(--grey3); }
.adopt-hero-delta { font-size:0.82rem; font-weight:600; color:#0d8f81; background:rgba(20,184,166,0.14); border-radius:10px; padding:0.25rem 0.6rem; }
.adopt-hero-delta.down { color:var(--red); background:rgba(224,48,58,0.1); }
.adopt-insight { font-size:0.82rem; color:var(--night2); background:rgba(20,184,166,0.08); border-left:3px solid var(--teal); border-radius:6px; padding:0.65rem 0.9rem; margin-bottom:1.1rem; }

/* the bar chart itself: y-axis ticks, gridlines, stacked/plain bars, direct value labels, x-axis labels */
.adopt-chart-row { display:flex; gap:0.7rem; }
.adopt-chart-yaxis { display:flex; flex-direction:column; justify-content:space-between; font-size:0.68rem; color:var(--grey3); text-align:right; flex-shrink:0; width:40px; font-variant-numeric:tabular-nums; }
.adopt-chart-main { position:relative; flex:1; min-width:0; overflow-x:auto; padding-bottom:1.6rem; }
.adopt-chart-gridlines { position:absolute; top:0; left:0; right:0; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; }
.adopt-chart-gridline { border-top:1px solid var(--line); }
.adopt-chart-cols { display:flex; align-items:flex-end; gap:0.9rem; padding:0 0.3rem; position:relative; min-width:min-content; }
.adopt-trend-line { position:absolute; top:0; left:0; pointer-events:none; z-index:1; overflow:visible; }
/* height is set inline to the full chart height (not just the bar's own height) and justify-content
   pins content to the bottom -- otherwise the column's own CSS box only covers its visible content (tip
   + bar), so a short bar leaves most of the chart area above it outside the hoverable element entirely.
   Barely noticeable on a tall stacked bar; a real miss target on the grouped chart's often-tiny second
   bar (Kriti, 2026-10-06: "your hover numbers are gone"). */
.adopt-bar-col { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; width:42px; flex-shrink:0; position:relative; z-index:2; }
.adopt-bar-tip { font-size:0.64rem; font-weight:700; color:var(--night2); margin-bottom:3px; font-variant-numeric:tabular-nums; white-space:nowrap; opacity:0; transition:opacity 0.12s; }
.adopt-bar-col:hover .adopt-bar-tip { opacity:1; }
.adopt-bar-stack { width:100%; border-radius:4px 4px 0 0; overflow:hidden; display:flex; flex-direction:column-reverse; min-height:2px; }
.adopt-bar-seg { width:100%; }
.adopt-bar-seg.texture, .adopt-bar-thin.texture { background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 3px, transparent 3px 6px); }
.adopt-bar-pair { display:flex; align-items:flex-end; justify-content:center; }
.adopt-bar-thin { border-radius:4px 4px 0 0; }
/* legend dots are 9px -- the bars' own 3px/6px stripe reads as a single diagonal slash at that size, so
   the legend gets its own finer 2px/4px band instead (Fable's own legend-dot stripe, productdemo/
   admin_intro.html line 1078 -- her bars and her legend dots already use two different band widths for
   the same reason). */
.adopt-legend i.texture { background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 2px, transparent 2px 4px); }
.adopt-bar-col:hover .adopt-bar-stack { outline:2px solid var(--night2); outline-offset:1px; }
.adopt-tip-dot { color:var(--grey3); }
.adopt-bar-label { font-size:0.66rem; color:var(--grey3); margin-top:0.45rem; white-space:nowrap; position:absolute; bottom:-1.5rem; left:50%; transform:translateX(-50%); }

/* Applied Learning's two-axis chart -- a right-hand axis to mirror .adopt-chart-yaxis, a single plain
   bar, and a hoverable line point. The hover label is its own shared class (.adopt-hover-num) nested
   INSIDE the bar or the dot, never on the shared column -- that's what keeps the two mutually exclusive:
   hovering the bar can never also light up the dot's label, and vice versa. */
.adopt-chart-yaxis-right { display:flex; flex-direction:column; justify-content:space-between; font-size:0.68rem; color:var(--grey3); text-align:left; flex-shrink:0; width:36px; font-variant-numeric:tabular-nums; }
.adopt-bar-single { position:relative; width:100%; border-radius:4px 4px 0 0; background-color:var(--night2); }
.adopt-bar-single:hover { outline:2px solid var(--night2); outline-offset:1px; }
.adopt-hover-num { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:4px; font-size:0.64rem; font-weight:700; color:var(--night2); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.12s; font-variant-numeric:tabular-nums; z-index:5; }
.adopt-hover-num.teal { color:var(--teal); }
/* the line's own hover label sits BELOW its dot, not above (Kriti, 2026-10-06: "the label should show
   below the line") -- the dot usually sits near the top of the chart (close to 100%), so a label floating
   above it has nowhere safe to render; .adopt-chart-main's overflow-x:auto implicitly makes its OTHER
   axis "auto" too (a genuine CSS rule, not a bug in that line), so anything that drifts above the chart's
   own box there gets silently clipped -- which is the real reason the label "didn't show" at all, not a
   hover-trigger problem. Below the dot always has clear chart space under it instead. */
.adopt-hover-num.below { bottom:auto; top:100%; margin-bottom:0; margin-top:6px; }
.adopt-bar-single:hover .adopt-hover-num { opacity:1; }
.adopt-line-dot { position:absolute; left:50%; width:10px; height:10px; margin-left:-5px; margin-bottom:-5px; border-radius:50%; background:var(--teal); border:2px solid #fff; box-shadow:0 0 0 1px rgba(4,26,64,0.12); cursor:pointer; z-index:4; }
.adopt-line-dot { cursor:default; }
/* Success Rate labels are ALWAYS visible (Kriti, 2026-10-07: "don't give them hover... show that value and make
   sure it doesn't get cut by the line itself"). A solid white pill sits ABOVE the line in stacking order, so the
   line can never run through the digits; which side of the dot it sits on is chosen per point in JS. */
.adopt-line-label { position:absolute; left:50%; transform:translateX(-50%); font-size:0.68rem; font-weight:700; color:#0d8f81; background:#fff; padding:1px 5px; border-radius:8px; box-shadow:0 0 0 1px rgba(4,26,64,0.1); white-space:nowrap; pointer-events:none; z-index:5; font-variant-numeric:tabular-nums; }
.adopt-line-label.above { bottom:100%; margin-bottom:5px; }
.adopt-line-label.below { top:100%; margin-top:5px; }
/* Atoms Applied's hover value sits INSIDE the bar, centred, in white (Kriti, 2026-10-07) -- so it can never
   collide with a Success Rate label. A bar too short to hold it (under 20px) keeps the old above-the-bar spot. */
.adopt-bar-single .adopt-hover-num.in-bar { bottom:auto; top:50%; margin:0; transform:translate(-50%,-50%); color:#fff; font-size:0.74rem; }
/* Kriti, 2026-10-06: "on the y-axis I need labeling... left side says number of atoms applied, right
   side says success rate" -- same vertical rotated title Fable uses (productdemo/admin_intro.html's own
   .axis-title-v), copied exactly: the left title reads bottom-to-top, the right one top-to-bottom. */
.adopt-axis-title-v { writing-mode:vertical-rl; transform:rotate(180deg); font-size:0.64rem; color:var(--grey3); font-weight:600; flex:none; display:flex; align-items:center; justify-content:center; padding:0 0.15rem; white-space:nowrap; }
.adopt-axis-title-v.right { transform:none; }

/* Average Duration's own chart shape -- Fable's "column list" (productdemo/admin_intro.html's
   .trend-row/.trend-track/.trend-fill), copied in structure: a period label + its (completed) value on
   one top line, then its track, then the incomplete track right underneath, thin and close (Kriti,
   2026-10-06: "the two bars for a particular period are very close... they're thin also"). */
.duration-row { margin-bottom:0.85rem; }
.duration-row-top { display:flex; justify-content:space-between; font-size:0.8rem; color:var(--night2); margin-bottom:0.3rem; }
.duration-track { height:6px; background:var(--grey1); border-radius:3px; overflow:hidden; }
.duration-fill { height:100%; border-radius:3px; background:linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%), linear-gradient(90deg, var(--night2) 0%, var(--night) 100%); }
.duration-fill.texture { background:var(--red) repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 3px, transparent 3px 6px); }
/* the incomplete track: thin, right under the completed one with almost no gap, no permanent label of
   its own -- its value only shows on hover, kept OUT of the always-visible right edge entirely, so the
   row never shows two numbers at once ("that'll be too many numbers"). */
.duration-track-incomplete { position:relative; height:4px; margin-top:3px; overflow:visible; }
.duration-track-incomplete::before { content:''; position:absolute; left:0; right:0; top:-7px; bottom:-7px; }   /* a 4px bar is hard to hover -- this widens the hover zone only */
.duration-hover-val { position:absolute; top:50%; transform:translateY(-50%); font-size:0.72rem; font-weight:700; color:var(--red); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.12s; font-variant-numeric:tabular-nums; }
.duration-track-incomplete:hover .duration-hover-val { opacity:1; }

/* ---- Filter trigger + drawer (Kriti, 2026-10-06 -- copied exactly from productdemo/admin_intro.html's
   own Reports & Insights drill-down drawer, the asset she asked this page to match) ---- */
.ri-dd-trigger {
  position:relative; display:flex; align-items:center; gap:0.45rem; font-family:'Poppins',sans-serif; font-size:0.82rem; font-weight:600;
  color:var(--night2); background:var(--white); border:1.5px solid rgba(4,26,64,0.14); border-radius:20px;
  padding:0.5rem 1.05rem; cursor:pointer; transition:border-color 0.15s, color 0.15s;
}
.ri-dd-trigger svg { width:15px; height:15px; }
.ri-dd-trigger:hover { border-color:var(--night2); color:var(--night); }
.adopt-fb-body { display:flex; align-items:center; gap:2.4rem; flex-wrap:wrap; }
.adopt-fb-hero { min-width:170px; }
.adopt-fb-num { font-size:3rem; font-weight:700; color:var(--night); line-height:1; }
.adopt-fb-label { font-size:0.84rem; color:var(--grey3); margin-top:0.5rem; display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap; }
.adopt-fb-tag { font-size:0.62rem; font-weight:700; color:#fff; padding:0.2rem 0.6rem; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; }
.adopt-fb-tag.great { background:var(--green); } .adopt-fb-tag.good { background:var(--teal); }
.adopt-fb-tag.fair { background:var(--gold); color:var(--night); } .adopt-fb-tag.poor { background:var(--red); }
.adopt-fb-meta { font-size:0.78rem; color:var(--grey3); margin-top:0.35rem; }
.adopt-fb-dist { flex:1; min-width:260px; }
.adopt-fb-bar { display:flex; gap:2px; height:12px; border-radius:6px; overflow:hidden; margin-bottom:0.9rem; background:var(--grey1); }
.adopt-fb-bar span.pro, .adopt-fb-legend i.pro { background:var(--teal); }
.adopt-fb-bar span.pas, .adopt-fb-legend i.pas { background:var(--grey2); }
.adopt-fb-bar span.det, .adopt-fb-legend i.det { background:var(--red); }
.adopt-fb-legend-row { display:flex; align-items:center; gap:0.55rem; font-size:0.84rem; color:var(--night2); padding:0.28rem 0; }
.adopt-fb-legend-row i { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.adopt-fb-legend-row .lbl { flex:1; } .adopt-fb-legend-row small { color:var(--grey3); font-size:0.76rem; margin-left:0.3rem; }
.adopt-fb-legend-row .val { font-weight:600; color:var(--night); font-variant-numeric:tabular-nums; }
.adopt-fb-note { font-size:0.76rem; color:var(--grey3); margin-top:1.1rem; }
.adopt-fb-empty { color:var(--grey3); font-size:0.9rem; padding:1.2rem 0; }
.ri-dd-item { margin-bottom:0.6rem; }
.ri-dd-toggle { width:100%; text-align:left; background:var(--grey1); border:none; border-radius:10px; padding:0.7rem 0.9rem; font-family:'Poppins',sans-serif; font-size:0.84rem; font-weight:600; color:var(--night2); cursor:pointer; transition:background 0.15s, color 0.15s; }
.ri-dd-toggle:hover { background:var(--grey2); }

// ── talking to the server ─────────────────────────────────────────────────
async function api(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || 'GET', headers: { 'X-User-Id': CURRENT_USER_ID } };
  if (opts.json !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.json); init.method = opts.method || 'POST'; }
  if (opts.form) { init.body = opts.form; init.method = 'POST'; }
  let res;
  try { res = await fetch(API_BASE + path, init); }
  catch (e) { const err = new Error('Could not reach the server. Check your connection and try again.'); err.network = true; throw err; }
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const d = data && data.detail;
    const err = new Error(typeof d === 'string' ? d : (Array.isArray(d) ? d.map(x => x.msg).join('; ') : 'Something went wrong. Please try again.'));
    err.status = res.status; throw err;
  }
  return data;
}

// ── location picker: country, then a searchable list of that country's cities ──
async function loadWorld() {
  if (S.world) return S.world;
  const base = location.pathname.replace(/[^/]*$/, '');
  const urls = [base + 'assets/world_locations.json', '/assets/world_locations.json'];
  for (const u of urls) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); S.world = j.countries.map(c => ({ code: c[0], name: c[1], cities: c[2] })); return S.world; } } catch (e) {}
  }
  S.world = []; return S.world;
}
const COUNTRY_ALIASES = { usa: 'united states', 'u.s.a.': 'united states', us: 'united states', uk: 'united kingdom', 'u.k.': 'united kingdom', uae: 'united arab emirates', 'south korea': 'south korea', korea: 'south korea', russia: 'russia', 'czech republic': 'czechia' };
function findCountry(world, text) {
  const t = String(text || '').trim().toLowerCase(); if (!t) return null;
  const a = COUNTRY_ALIASES[t] || t;
  return world.find(c => c.name.toLowerCase() === a) || null;
}
// host: an element to fill. opts: {country, city, requireCity}. Returns {getValue, validate, touched}.

  host.innerHTML = `
    <div class="form-grid">
      <div class="field"><label>Country${opts.requireCity === false ? '' : ' <span class="req">*</span>'}</label><select class="loc-country"><option value="">Select country…</option>${world.map(c => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('')}</select><div class="err hidden"></div></div>
      <div class="field"><label>City${opts.requireCity === false ? '' : ' <span class="req">*</span>'}</label>
        <div class="combo"><input type="text" class="loc-city" autocomplete="off" placeholder="Choose a country first" disabled><div class="combo-list hidden"></div></div><div class="err hidden"></div></div>
    </div>
    <div class="footer-credit" style="padding:0.5rem 0 0; text-align:left">Location data © <a href="https://www.geonames.org" target="_blank" rel="noopener" style="text-decoration:underline">GeoNames</a>, CC BY 4.0</div>`;

    const v = inpCity.value.trim().toLowerCase();

    const shown = starts.concat(has).slice(0, 60);

    if (!shown.length) html = `<div class="combo-empty">${cities.length ? 'No match in the list.' : 'No city list for this country.'}</div>`;

// ── A limit under every box, and it is enforced (Kriti, 2026-10-01) ──────────
// Long boxes: 200 words. One-line boxes: 100 characters (email 254). The server enforces the same limits.
const LIMIT_WORDS = 200;
function wordCount(t) { const m = String(t || '').trim().match(/\S+/g); return m ? m.length : 0; }
function cutToWords(t, n) { const re = /\S+/g; let m, count = 0; while ((m = re.exec(t))) { count++; if (count > n) return t.slice(0, m.index).replace(/\s+$/, ''); } return t; }
function decorateLimit(el) {
  if (el.dataset.limitDone || el.disabled || el.readOnly || el.hasAttribute('data-nolimit') || el.closest('.um-search-wrap, .filter-bar, .combo')) return;
  const tag = el.tagName, type = (el.getAttribute('type') || 'text').toLowerCase();
  const hint = document.createElement('div'); hint.className = 'limit-hint';
  if (tag === 'TEXTAREA') {
    const max = +el.dataset.maxWords || LIMIT_WORDS;
    const upd = () => { if (wordCount(el.value) > max) el.value = cutToWords(el.value, max); const n = wordCount(el.value); hint.textContent = 'Max ' + max + ' words · ' + n + ' used'; hint.classList.toggle('at', n >= max); };
    el.addEventListener('input', upd); el.addEventListener('change', upd); el.addEventListener('limit-refresh', upd); upd();
  } else if (tag === 'INPUT' && (type === 'text' || type === 'email')) {
    const max = el.maxLength > 0 ? el.maxLength : (type === 'email' || el.hasAttribute('data-lower') ? 254 : 100);
    el.maxLength = max; hint.textContent = 'Max ' + max + ' characters';
  } else return;
  el.dataset.limitDone = '1';
  el.insertAdjacentElement('afterend', hint);
}
function decorateLimits(root) { $$('textarea, input', root).forEach(decorateLimit); }
new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) { if (n.matches('textarea, input')) decorateLimit(n); decorateLimits(n); } }))).observe(document.body, { childList: true, subtree: true });
// Emails never have a capital letter: whatever is typed into an email box is lower-cased on the spot.
document.addEventListener('input', e => {
  const t = e.target;
  if (t && t.tagName === 'INPUT' && (t.type === 'email' || t.hasAttribute('data-lower')) && t.value !== t.value.toLowerCase()) {
    let a = null, b = null; try { a = t.selectionStart; b = t.selectionEnd; } catch (_) {}
    t.value = t.value.toLowerCase(); try { if (a !== null) t.setSelectionRange(a, b); } catch (_) {}
  }
}, true);

async function renderUsers() {
  umShell('users', `<button class="btn-primary-add" id="btnAdd">+ Add User</button>`);
  $('#umBody').innerHTML = '<div class="loading-block"><span class="spinner"></span> Loading people…</div>';
  try { await loadUsers(true); } catch (e) { $('#umBody').innerHTML = `<div class="banner">${esc(e.message)}</div>`; return; }
  $('#btnAdd').onclick = openAddUser;
  drawUsers();
}
function filteredUsers() {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return S.users.filter(u => {
    if (q && !(String(u.name || '').toLowerCase().includes(q) || String(u.email || '').toLowerCase().includes(q) || String(u.username || '').toLowerCase().includes(q))) return false;
    if (f.company && String(u.company || '').toLowerCase() !== f.company.toLowerCase()) return false;
    if (f.dept && String(u.department || '').split('/')[0].trim().toLowerCase() !== f.dept.toLowerCase()) return false;
    if (f.role && (u.access_type || 'user') !== f.role) return false;
    return true;
  });
}
function drawUsers() {
  const all = S.users, comps = scopeCompanies();

    <div class="stat-grid">

      <div class="stat-card"><div class="stat-icon gold">${icon('shield')}</div><div class="stat-body"><div class="stat-num">${nAdmins}</div><div class="stat-label">Admins</div></div></div>
      <div class="stat-card"><div class="stat-icon green">${icon('building')}</div><div class="stat-body"><div class="stat-num">${comps.length}</div><div class="stat-label">${comps.length === 1 ? 'Company' : 'Companies'}</div></div></div>
      <div class="stat-card"><div class="stat-icon navy">${icon('grid')}</div><div class="stat-body"><div class="stat-num">${nDepts}</div><div class="stat-label">Departments</div></div></div>
    </div>

      <div class="um-search-wrap">${icon('search').replace('<svg', '<svg class="um-search-icon"')}<input type="text" class="um-search" id="fSearch" placeholder="Search by name, email or username" value="${esc(S.filters.q)}"></div>
      ${comps.length > 1 ? `<div class="filter-select-wrap"><select class="filter-select" id="fCompany"><option value="">All Companies</option>${comps.map(c => `<option ${S.filters.company === c.company_name ? 'selected' : ''} value="${esc(c.company_name)}">${esc(c.company_name)}</option>`).join('')}</select></div>` : ''}
      <div class="filter-select-wrap"><select class="filter-select" id="fDept"><option value="">All Departments</option>${deptOpts.map(d => `<option ${S.filters.dept === d ? 'selected' : ''} value="${esc(d)}">${esc(titleCase(d))}</option>`).join('')}</select></div>
      <div class="filter-select-wrap"><select class="filter-select" id="fRole"><option value="">All Roles</option>${['user', 'manager'].concat(all.some(u => u.access_type === 'LND') ? ['LND'] : [], ['admin', 'company_admin', 'super_admin']).map(r => `<option ${S.filters.role === r ? 'selected' : ''} value="${r}">${ROLE_LABEL[r]}</option>`).join('')}</select></div>

  $('#fSearch').oninput = e => { S.filters.q = e.target.value; S.page = 1; drawRows(); };

  $('#fRole').onchange = e => { S.filters.role = e.target.value; S.page = 1; drawRows(); };
  $('#btnExport').onclick = exportUsers;

function drawRows() {
  const rows = filteredUsers(), total = rows.length, per = S.pageSize;
  const pages = Math.max(1, Math.ceil(total / per)); if (S.page > pages) S.page = pages;
  const slice = rows.slice((S.page - 1) * per, S.page * per);
  const tb = $('#umRows');
  tb.innerHTML = slice.length ? slice.map(u => {
    return `<tr class="clickable" data-id="${esc(u.user_id)}">
      <td><div class="um-user-cell">${avatarHtml(u.name)}<div><div class="um-user-name">${esc(u.name || '(no name)')}</div><div class="um-user-email">${esc(u.email || u.username || '')}</div></div></div></td>
      <td>${esc(u.company || '—')}</td><td>${esc(titleCase(String(u.department || '').split('/')[0].trim()) || '—')}</td>
      <td>${roleBadge(u.access_type)}${(u.access_type !== 'manager' && String(u.is_people_manager) === 'true') ? ' <span class="chip">People manager</span>' : ''}</td>
      <td data-stop="1"><button class="um-action-btn" data-menu="${esc(u.user_id)}" aria-label="Actions for ${esc(u.name)}">${icon('dots')}</button></td></tr>`;
  }).join('') : `<tr><td colspan="5" class="empty-row">${S.users.length ? 'No one matches those filters.' : 'No people to show yet. Add someone with “+ Add User”.'}</td></tr>`;
  $$('tr.clickable', tb).forEach(tr => tr.onclick = e => { if (e.target.closest('[data-stop]')) return; openEditUser(tr.dataset.id); });
  $$('[data-menu]', tb).forEach(b => b.onclick = e => { e.stopPropagation(); rowMenu(b, S.users.find(u => u.user_id === b.dataset.menu)); });
  $('#umPag').innerHTML = `<div class="um-pag-info">${total ? `Showing ${(S.page - 1) * per + 1}–${Math.min(S.page * per, total)} of ${total.toLocaleString()} people` : ''}</div>
    <div class="um-pag-controls"><button class="pag-btn" id="pgPrev" ${S.page <= 1 ? 'disabled' : ''}>Previous</button><button class="pag-btn" id="pgNext" ${S.page >= pages ? 'disabled' : ''}>Next</button></div>`;
  $('#pgPrev').onclick = () => { S.page--; drawRows(); }; $('#pgNext').onclick = () => { S.page++; drawRows(); };
}
function rowMenu(anchor, u) {
  if (!u) return;
  const al = u.allowed || [], me = u.user_id === S.me.user_id;
  const canRole = (level() === 'super' || (level() === 'company' && ['user', 'manager', 'LND', 'admin'].indexOf(u.access_type || 'user') !== -1)) && !me && u.access_type !== 'super_admin';
  showMenu(anchor, [
    { label: al.indexOf('edit') !== -1 ? 'View / edit profile' : 'View profile', onClick: () => openEditUser(u.user_id) },
    { label: 'Assign skills…', disabled: al.indexOf('skills') === -1, onClick: () => { location.hash = '#learning/assign?user=' + encodeURIComponent(u.user_id); } },
    { label: 'Admin role…', disabled: !canRole, title: canRole ? '' : 'Only a Company Admin (or the super admin) can change admin roles', onClick: () => openRoleModal(u) },
    { label: 'Resend invite email', disabled: al.indexOf('edit') === -1, title: 'Only for people who have never signed in', onClick: () => resendInvite(u) },
    '-',
    { label: me ? 'Delete (not your own account)' : 'Delete…', danger: true, disabled: al.indexOf('delete') === -1, title: al.indexOf('delete') === -1 ? 'You cannot delete this person' : '', onClick: () => deleteOne(u) },
  ]);
}
function exportUsers() {
  const rows = [['Name', 'Email', 'Username', 'Company', 'Department', 'Role']].concat(filteredUsers().map(u => [u.name, u.email, u.username, u.company, u.department, ROLE_LABEL[u.access_type || 'user']]));
  downloadText('wotg-users.csv', toCsv(rows));
}

}

// ── Delete (with the "who takes over?" step) ──────────────────────────────
async function deleteOne(u) {
  let opts;
  try { opts = await api('/api/admin/reassign-candidates?user_id=' + encodeURIComponent(u.user_id)); } catch (e) { toast(e.message, 'error'); return; }
  const m = openModal({ title: 'Delete ' + (u.name || 'this person') + '?', size: 'narrow', sticky: true });
  let body = `<p style="font-size:0.9rem;color:var(--night2)">This permanently removes <strong>${esc(u.name)}</strong> (${esc(u.email)}). It cannot be undone.</p>`;
  if (opts.needs_reassignment) {
    if (opts.candidates.length) {
      body += `<div class="banner info" style="margin-top:1rem"><strong>${esc(u.name)} created ${opts.people_count} ${opts.people_count === 1 ? 'person' : 'people'}.</strong> Choose which admin takes them over. They become that admin's contact for sign-in help.</div>
        <div class="field"><label>Who takes over? <span class="req">*</span></label><select id="dl_to"><option value="">Select an admin…</option>${opts.candidates.map(c => `<option value="${esc(c.user_id)}">${esc(c.name)} — ${esc(ROLE_LABEL[c.role] || c.role)} (${esc(c.email)})</option>`).join('')}</select><div class="help">Only admins with access to all of those people are listed.</div></div>`;
    } else {
      body += `<div class="banner" style="margin-top:1rem"><strong>${esc(u.name)} created ${opts.people_count} ${opts.people_count === 1 ? 'person' : 'people'}, and no other admin has access to all of them.</strong> Give another admin access to them first, then delete.</div>`;
    }
  }
  m.body.innerHTML = body;
  const blocked = opts.needs_reassignment && !opts.candidates.length;
  setFoot(m, [{ label: 'Cancel', onClick: () => m.close() }, { label: 'Delete', cls: 'btn-danger', id: 'dl_go', async onClick(btn) {
    const to = opts.needs_reassignment ? ($('#dl_to') || {}).value : '';
    if (opts.needs_reassignment && !to) { toast('Please choose who takes over first.', 'warn'); return; }
    btn.disabled = true; btn.textContent = 'Deleting…';
    try { await api('/api/admin/delete-user', { json: { user_id: u.user_id, reassign_to: to || '' } }); m.close(); toast(u.name + ' was deleted.'); S.selected.delete(u.user_id); S.managed = null; await loadUsers(true); drawUsers(); }
    catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Delete'; }
  } }]);
  if (blocked) $('#dl_go').disabled = true;
}

const plural = n => n + (n === 1 ? ' person' : ' people');
// "3 skipped: not in your access (2); already in that department (1)"
function reasonSummary(results, okWord) {
  const bad = results.filter(r => r.status !== okWord), counts = {};
  bad.forEach(r => { const k = String(r.status).replace(/^SKIPPED -- /, ''); counts[k] = (counts[k] || 0) + 1; });
  return bad.length ? ' ' + bad.length + ' skipped: ' + Object.keys(counts).map(k => esc(k) + (counts[k] > 1 ? ' (' + counts[k] + ')' : '')).join('; ') + '.' : '';
}

function setupBulkEdit(people) {
  const sel = new Set();
  const comps = scopeCompanies();
  $('#bk_e_people').innerHTML = '';
  const refresh = () => {
    const what = $('#bk_what').value, n = sel.size, miss = [];
    if (!n) miss.push('tick at least one person');
    if (!what) miss.push('choose what to change');
    if (what === 'manager') { if (!$('#bk_mname').value.trim()) miss.push("the new manager's name"); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('#bk_memail').value.trim())) miss.push("the new manager's email"); }
    if (what === 'department' && !$('#bk_dept').value) miss.push('the department');
    $('#bk_apply').disabled = miss.length > 0;
    $('#bk_apply').dataset.idle = 'Apply to ' + (n ? plural(n) : 'everyone ticked'); $('#bk_apply').textContent = $('#bk_apply').dataset.idle;
    $('#bk_missing').textContent = miss.length ? 'Still needed: ' + miss.join(', ') + '.' : '';
  };
  peoplePicker($('#bk_e_people'), people, sel, refresh);
  const drawFields = () => {
    const what = $('#bk_what').value, box = $('#bk_fields');
    if (what === 'manager') {
      box.innerHTML = `<div class="form-grid"><div class="field"><label>New manager's name <span class="req">*</span></label><input type="text" id="bk_mname"></div><div class="field"><label>New manager's email <span class="req">*</span></label><input type="email" id="bk_memail" data-lower></div></div>`;
      $('#bk_mname').oninput = refresh; $('#bk_memail').oninput = refresh;
    } else if (what === 'department') {
      box.innerHTML = `<div class="field"><label>Move them to <span class="req">*</span></label><select id="bk_dept"><option value="">Select a department…</option>${comps.map(c => `<optgroup label="${esc(c.company_name)}">${c.departments.map(d => `<option value="${esc(c.company_code + '|' + d.department_code)}">${esc(titleCase(d.department_name))}</option>`).join('')}</optgroup>`).join('')}</select><div class="help">Only people who belong to that company can be moved there, and only into departments you have access to.</div></div>`;
      $('#bk_dept').onchange = refresh;
    } else if (what === 'mark' || what === 'unmark') {
      box.innerHTML = `<div class="help">${what === 'mark' ? 'Their access level becomes Manager. Admins stay Admins and are simply marked as people managers.' : 'Managers go back to the User access level. Admins stay Admins.'}</div>`;
    } else box.innerHTML = '';
    refresh();
  };
  $('#bk_what').onchange = drawFields;
  drawFields();
  $('#bk_apply').onclick = () => {
    const what = $('#bk_what').value, ids = Array.from(sel);
    let path, body = { user_ids: ids };
    if (what === 'manager') { path = '/api/admin/bulk-change-manager'; body.manager_name = $('#bk_mname').value; body.manager_email = $('#bk_memail').value; }
    else if (what === 'department') { path = '/api/admin/bulk-move-department'; const [c, d] = $('#bk_dept').value.split('|'); body.company_code = c; body.department_code = d; }
    else { path = '/api/admin/bulk-set-people-manager'; body.is_people_manager = what === 'mark'; }
    return saveFlow($('#bk_apply'), 'Saving…', 'Saved', async () => {
      const r = await api(path, { json: body });
      const ok = r.results.filter(x => x.status === 'changed').length;
      S.managed = null; await loadUsers(true);
      const note = `<div class="banner ${ok ? 'info' : ''}"><strong>Changed ${plural(ok)}.</strong>${reasonSummary(r.results, 'changed')}</div>`;
      setupBulkEdit(S.users.filter(u => (u.allowed || []).indexOf('edit') !== -1));
      setupBulkDelete(S.users.filter(u => (u.allowed || []).indexOf('delete') !== -1));
      $('#bk_e_result').innerHTML = note;
    }).then(() => { const c = $('#bk_e_people .pp_none'); if (c) c.click(); });   // re-evaluates the (now empty) selection
  };
}

// A button that says what it is doing and then that it is done: "Saving…" -> "Saved", then back to its label.
async function saveFlow(btn, doing, done, fn) {
  if (btn.dataset.idle === undefined) btn.dataset.idle = btn.innerHTML;
  btn.disabled = true; btn.textContent = doing;
  let ok = false;
  try { ok = (await fn()) !== false; } catch (e) { toast(e.message, 'error'); }
  if (ok) { btn.textContent = done; btn.classList.add('btn-done'); await new Promise(r => setTimeout(r, 1600)); btn.classList.remove('btn-done'); }
  btn.innerHTML = btn.dataset.idle; btn.disabled = false;
  return ok;
}
const ANSWER_FIELDS = [['assigned_by', 'by'], ['assignor_role', 'role'], ['assignor_reason_for_assignment', 'reason'], ['business_impact', 'impact'], ['user_benefit', 'benefit'], ['application_examples', 'examples']];

// ── Shared pickers: used by BOTH the Skill Assignment Center and the Initiative Builder ──
// skillPicker: "Reflector or Capability", the pick, and the definition shown right under it.
// multi=false -> the one pick is the answer; multi=true -> "Add" collects a list of reflectors.
function skillPicker(root, gl, multi, onChange) {
  const caps = Array.from(new Set(gl.map(r => r.capability_name))).sort();
  const chosen = [];
  root.innerHTML = `<div class="form-grid">
    <div class="field"><label>Choose by <span class="req">*</span></label><select class="sp_level"><option value="reflector">Reflector (one skill)</option><option value="capability">Capability (all of its reflectors)</option></select></div>
    <div class="field"><label class="sp_label">Reflector <span class="req">*</span></label><select class="sp_pick"></select>${multi ? '<div style="margin-top:0.5rem"><button class="btn-outline sp_add" type="button">Add to this initiative</button></div>' : ''}</div>
    <div class="full sp_def"></div>
    ${multi ? '<div class="field full"><label>Skills in this initiative <span class="req">*</span></label><div class="sp_chosen"></div></div>' : ''}
  </div>`;
  const level = $('.sp_level', root), pick = $('.sp_pick', root), def = $('.sp_def', root);
  const inCap = c => gl.filter(r => r.capability_name === c);
  const drawPick = () => {
    const cap = level.value === 'capability';
    $('.sp_label', root).innerHTML = (cap ? 'Capability' : 'Reflector') + ' <span class="req">*</span>';
    pick.innerHTML = '<option value="">Select…</option>' + (cap
      ? caps.map(c => `<option value="${esc(c)}">${esc(c)} (${inCap(c).length} reflectors)</option>`).join('')
      : caps.map(c => `<optgroup label="${esc(c)}">${inCap(c).map(r => `<option value="${esc(r.reflector_name)}">${esc(r.reflector_name)}</option>`).join('')}</optgroup>`).join(''));
    drawDef();
  };
  const drawDef = () => {
    const v = pick.value;
    if (!v) { def.innerHTML = ''; return; }
    if (level.value === 'capability') {
      const rs = inCap(v), cd = (rs[0] || {}).capability_definition || '';
      def.innerHTML = `<div class="def-box"><div class="def-title">${esc(v)}</div><div class="def-text">${esc(cd)}</div><div class="def-sub">Includes ${rs.length} reflector${rs.length === 1 ? '' : 's'}:</div>${rs.map(r => `<span class="chip">${esc(r.reflector_name)}</span>`).join('')}</div>`;
    } else {
      const r = gl.find(x => x.reflector_name === v) || {};
      def.innerHTML = `<div class="def-box"><div class="def-title">${esc(v)} <span class="def-cap">${esc(r.capability_name || '')}</span></div><div class="def-text">${esc(r.reflector_definition || '')}</div></div>`;
    }
  };
  const drawChosen = () => {
    if (!multi) return;
    $('.sp_chosen', root).innerHTML = chosen.length ? chosen.map((n, i) => `<span class="chip chip-x">${esc(n)} <button type="button" class="chip-del" data-i="${i}" aria-label="Remove ${esc(n)}">×</button></span>`).join('') : '<span class="help">None added yet.</span>';
    $$('.chip-del', root).forEach(b => b.onclick = () => { chosen.splice(+b.dataset.i, 1); drawChosen(); onChange && onChange(); });
  };
  level.onchange = () => { drawPick(); onChange && onChange(); };
  pick.onchange = () => { drawDef(); onChange && onChange(); };
  if (multi) $('.sp_add', root).onclick = () => {
    if (!pick.value) { toast('Choose a reflector or capability first.', 'warn'); return; }
    (level.value === 'capability' ? inCap(pick.value).map(r => r.reflector_name) : [pick.value]).forEach(n => { if (chosen.indexOf(n) === -1) chosen.push(n); });
    pick.value = ''; drawDef(); drawChosen(); onChange && onChange();
  };
  drawPick(); drawChosen();
  return { skills: () => multi ? chosen.slice() : (!pick.value ? [] : level.value === 'capability' ? inCap(pick.value).map(r => r.reflector_name) : [pick.value]) };
}

// peoplePicker: filters (department, designation, manager), search, a "select everyone shown" box, and a tick list.
// `sel` is a Set of user_ids kept by the caller. The filters shorten the list, so "select everyone shown" can pick,
// say, all 50 people reporting to one manager.
function peoplePicker(root, people, sel, onChange) {
  const deptOf = u => String(u.department || '').split('/')[0].trim().toLowerCase();
  const desigOf = u => String(u.designation || '').trim();
  const mgrKey = u => String(u.manager_email || '').trim().toLowerCase() || (u.manager_name ? 'name:' + String(u.manager_name).trim().toLowerCase() : '__none');
  const distinct = (keyOf, labelOf) => { const m = new Map(); people.forEach(u => { const k = keyOf(u); if (k !== '' && !m.has(k)) m.set(k, labelOf(u)); }); return Array.from(m.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1]))); };
  const depts = distinct(deptOf, u => titleCase(deptOf(u))), desigs = distinct(u => desigOf(u).toLowerCase(), desigOf);
  const mgrs = distinct(mgrKey, u => mgrKey(u) === '__none' ? 'No manager recorded' : (u.manager_name || u.manager_email) + (u.manager_email && u.manager_name ? ' (' + u.manager_email + ')' : ''));
  const F = { dept: '', desig: '', mgr: '' };
  const opts = (all, list) => `<option value="">${all}</option>` + list.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join('');
  root.innerHTML = `<div class="pp-filters">
      <div class="filter-select-wrap"><select class="filter-select pp_f_dept" aria-label="Filter by department">${opts('All departments', depts)}</select></div>
      <div class="filter-select-wrap"><select class="filter-select pp_f_desig" aria-label="Filter by designation">${opts('All designations', desigs)}</select></div>
      <div class="filter-select-wrap"><select class="filter-select pp_f_mgr" aria-label="Filter by manager">${opts('All managers', mgrs)}</select></div></div>
    <input type="search" class="input pp_q" placeholder="Search people by name or email…" style="margin-bottom:0.4rem">
    <div class="check-list pp_list" style="max-height:220px"></div>
    <div class="help"><label style="display:inline-flex;gap:0.4rem;align-items:center;font-weight:600"><input type="checkbox" class="pp_all"> Select everyone shown</label> · <button type="button" class="btn-link pp_none">Clear</button> · <span class="pp_shown"></span> · <span class="pp_count">0 selected</span></div>`;
  const q = $('.pp_q', root), list = $('.pp_list', root), all = $('.pp_all', root);
  const shown = () => { const t = q.value.trim().toLowerCase(); return people.filter(u => (!t || (u.name || '').toLowerCase().includes(t) || (u.email || '').toLowerCase().includes(t))
    && (!F.dept || deptOf(u) === F.dept) && (!F.desig || desigOf(u).toLowerCase() === F.desig) && (!F.mgr || mgrKey(u) === F.mgr)); };
  const sync = () => {
    const sh = shown();
    $('.pp_count', root).textContent = sel.size + ' selected';
    $('.pp_shown', root).textContent = sh.length + ' shown';
    all.checked = sh.length > 0 && sh.every(u => sel.has(u.user_id));
    onChange && onChange();
  };
  const draw = () => {
    const sh = shown();
    list.innerHTML = sh.length ? sh.map(u => `<label><input type="checkbox" class="pp" data-id="${esc(u.user_id)}" ${sel.has(u.user_id) ? 'checked' : ''}> ${esc(u.name)} <span style="color:var(--grey3);font-size:0.75rem">· ${esc(u.email)}</span></label>`).join('') : '<div class="combo-empty">No one to show.</div>';
    $$('.pp', list).forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.id) : sel.delete(c.dataset.id); sync(); });
    sync();
  };
  q.oninput = draw;
  $('.pp_f_dept', root).onchange = e => { F.dept = e.target.value; draw(); };
  $('.pp_f_desig', root).onchange = e => { F.desig = e.target.value; draw(); };
  $('.pp_f_mgr', root).onchange = e => { F.mgr = e.target.value; draw(); };
  all.onchange = () => { shown().forEach(u => all.checked ? sel.add(u.user_id) : sel.delete(u.user_id)); draw(); };
  $('.pp_none', root).onclick = () => { sel.clear(); draw(); };
  draw();
  return { redraw: draw };
}

// ── "Edit or remove a skill": pick a skill, see who has it, change the six answers or take it away ──
function setupEditRemove(gl) {
  const caps = Array.from(new Set(gl.map(r => r.capability_name))).sort();
  const root = $('#ed_root');
  const sel = new Set();
  let holders = [], dirty = false;
  const FIELDS = ANSWER_FIELDS.map(f => ({ key: f[0], el: '#ed_' + f[1] }));
  const answersOf = u => u.answers || {};
  const ticked = () => holders.filter(h => sel.has(h.user_id));
  const setField = (f, v) => { const el = $(f.el); if (f.key === 'assignor_role' && v && !Array.from(el.options).some(o => o.value === v)) el.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(v)}</option>`); el.value = v || ''; el.dispatchEvent(new Event('limit-refresh')); };
  const refresh = () => {
    if (!$('#ed_save')) return;   // the person left this page while a save was finishing
    const t = ticked(), complete = FIELDS.every(f => $(f.el).value.trim());
    $('#ed_save').disabled = !(t.length && complete); $('#ed_remove').disabled = !t.length;
    const miss = [];
    if (!t.length) miss.push('tick at least one person');
    FIELDS.forEach(f => { if (!$(f.el).value.trim()) miss.push('the ' + ({ assigned_by: 'assigned by', assignor_role: 'role', assignor_reason_for_assignment: 'reason', business_impact: 'business difference', user_benefit: 'benefit', application_examples: 'examples' })[f.key]); });
    $('#ed_missing').textContent = ($('#ed_save').disabled && miss.length) ? 'To save: ' + miss.join(', ') + '.' : '';
  };
  const onTick = () => {
    const t = ticked();
    if (t.length && !dirty) FIELDS.forEach(f => setField(f, answersOf(t[0])[f.key]));
    const differ = t.length > 1 && t.some(x => FIELDS.some(f => (answersOf(x)[f.key] || '') !== (answersOf(t[0])[f.key] || '')));
    $('#ed_note').innerHTML = differ ? '<div class="banner" style="margin:0.6rem 0 0">The people you ticked currently have different answers. Saving gives all of them the answers below.</div>' : '';
    refresh();
  };
  const load = async (skill, keepNote) => {
    sel.clear(); dirty = false; $('#ed_note').innerHTML = '';
    $('#ed_def').innerHTML = ''; $('#ed_body').classList.add('hidden'); $('#ed_empty').classList.add('hidden');
    if (!skill) return;
    const r0 = gl.find(x => x.reflector_name === skill) || {};
    $('#ed_def').innerHTML = `<div class="def-box"><div class="def-title">${esc(skill)} <span class="def-cap">${esc(r0.capability_name || '')}</span></div><div class="def-text">${esc(r0.reflector_definition || '')}</div></div>`;
    $('#ed_people').innerHTML = '<div class="loading-block"><span class="spinner"></span> Looking up who has it…</div>'; $('#ed_body').classList.remove('hidden');
    try { holders = (await api('/api/admin/skill-holders?skill=' + encodeURIComponent(skill))).people; } catch (e) { toast(e.message, 'error'); $('#ed_body').classList.add('hidden'); return; }
    if (!holders.length) { $('#ed_body').classList.add('hidden'); $('#ed_empty').classList.remove('hidden'); return; }
    peoplePicker($('#ed_people'), holders, sel, onTick);
    FIELDS.forEach(f => setField(f, ''));
    refresh();
  };
  $('#ed_skill').onchange = () => load($('#ed_skill').value);
  FIELDS.forEach(f => { $(f.el).oninput = () => { dirty = true; refresh(); }; $(f.el).onchange = () => { dirty = true; refresh(); }; });
  $('#ed_save').onclick = () => {
    const skill = $('#ed_skill').value, ids = Array.from(sel);
    const body = { user_ids: ids, skill }; FIELDS.forEach(f => { body[f.key] = $(f.el).value; });
    return saveFlow($('#ed_save'), 'Saving…', 'Saved', async () => {
      const r = await api('/api/admin/bulk-assign-skill-to-users', { json: body });
      const ok = r.results.filter(x => x.status === 'assigned').length;
      $('#ed_result').innerHTML = `<div class="banner info"><strong>Saved for ${ok} of ${r.results.length} ${r.results.length === 1 ? 'person' : 'people'}.</strong>${ok < r.results.length ? ' The others were outside your access.' : ''}</div>`;
      S.usersLoaded = false;
      const keep = ids.slice(); await load(skill); keep.forEach(id => sel.add(id)); peoplePicker($('#ed_people'), holders, sel, onTick); onTick();
    }).then(refresh);
  };
  $('#ed_remove').onclick = async () => {
    const skill = $('#ed_skill').value, ids = Array.from(sel);
    if (!(await confirmBox('Remove ' + skill + '?', 'This takes the skill away from the ' + ids.length + (ids.length === 1 ? ' person' : ' people') + ' you ticked. Their answers for it are deleted.', 'Remove', true))) return;
    await saveFlow($('#ed_remove'), 'Removing…', 'Removed', async () => {
      const r = await api('/api/admin/bulk-remove-skill-from-users', { json: { user_ids: ids, skill } });
      const ok = r.results.filter(x => x.status === 'removed').length;
      $('#ed_result').innerHTML = `<div class="banner info"><strong>Removed from ${ok} of ${r.results.length} ${r.results.length === 1 ? 'person' : 'people'}.</strong>${ok < r.results.length ? ' The others were outside your access.' : ''}</div>`;
      S.usersLoaded = false; await load(skill);
    });
    refresh();
  };
}

// are. Month/Year's bars are SUB-DIVISIONS of the stated window (days of this month, months of this

// Quarter's bars are each a COMPLETE, separate period -- summing them would mix unrelated quarters
// together, so the hero is just the current (last) quarter's own total, "this quarter".
// The delta needs an explicit comparison ("minus compared to what?") -- only Quarter can show one for
// free right now, since the previous quarter is already sitting in the same series that's on screen.
// Month's "previous month" and Year's "previous year" need one more small piece (data this view
// doesn't fetch today) -- flagged to Kriti rather than guessed, 2026-10-06.
// ONE formula, shared by every tab's own big hero AND the three small cards up top (Kriti, 2026-10-06:
// "the two are sort of connected" -- they read the identical series through the identical function, so
// they can never say two different things about the same data.
function computeHero(series, period, metricFn, unitLabel) {
  if (!series.length) return { value: 0, suffix: unitLabel, deltaText: null };
  const sum = series.reduce((s, x) => s + metricFn(x), 0);
  if (period === 'quarter') {
    const last = series[series.length - 1], prev = series[series.length - 2];
    let deltaText = null;
    if (prev) { const d = pctDelta(metricFn(prev), metricFn(last)); if (d != null) deltaText = `${d >= 0 ? '+' : ''}${d.toFixed(0)}% vs last quarter`; }
    return { value: metricFn(last), suffix: `${unitLabel} this quarter`, deltaText };
  }
  if (period === 'month') {
    const [, m] = (series[series.length - 1].period || '').split('-').map(Number);
    return { value: sum, suffix: `${unitLabel} in ${MONTH_FULL[(m || 1) - 1]}`, deltaText: null };
  }
  return { value: sum, suffix: `${unitLabel} this year`, deltaText: null };
}
// Success Rate is a RATIO, not a count -- computeHero's generic sum-then-divide logic (built for
// additive metrics like hours/atoms) would be wrong here: summing each period's own percentage and
// dividing by the number of periods IS averaging an average, the exact mistake this whole codebase
// guards against everywhere else (see vo_adoption_report.py's top2box_percent docstring). Same
// month/quarter/year shape as computeHero, but sums the raw topBox/scored components across the visible
// window first, THEN divides. Used only by the three summary cards on the Applied Learning tab (Kriti,
// 2026-10-06: "you'll have to show me two lines... atoms applied in October, application success rate").
function successRateHero(series, period) {
  const unitLabel = 'application success rate';
  if (!series.length) return { value: 0, suffix: unitLabel };
  if (period === 'quarter') {
    const last = series[series.length - 1];
    return { value: last.successRate == null ? 0 : Math.round(last.successRate), suffix: `${unitLabel} this quarter` };
  }
  const topBox = series.reduce((s, x) => s + x.topBox, 0);
  const scored = series.reduce((s, x) => s + x.scored, 0);
  const value = scored ? Math.round((topBox / scored) * 100) : 0;
  if (period === 'month') {
    const [, m] = (series[series.length - 1].period || '').split('-').map(Number);
    return { value, suffix: `${unitLabel} in ${MONTH_FULL[(m || 1) - 1]}` };
  }
  return { value, suffix: `${unitLabel} this year` };
}
// Average Duration is a ratio too (minutes per session), same reasoning as successRateHero just above --
// sum the raw hours/count components across the visible window first, THEN divide. ALWAYS the completed
// sessions' own duration (Kriti, 2026-10-06: "this is longest COMPLETED average session... don't observe
// the incomplete ones") -- incomplete is drawn on the chart below but never feeds this number.
function avgDurationHero(series, period) {
  const unitLabel = 'min / session';
  if (!series.length) return { value: 0, suffix: unitLabel };
  if (period === 'quarter') {
    const last = series[series.length - 1];
    return { value: last.compAvgMin == null ? 0 : last.compAvgMin, suffix: `${unitLabel} this quarter` };
  }
  const hours = series.reduce((s, x) => s + x.compDurHours, 0);
  const count = series.reduce((s, x) => s + x.compDurCount, 0);
  const value = count ? (hours / count) * 60 : 0;
  if (period === 'month') {
    const [, m] = (series[series.length - 1].period || '').split('-').map(Number);
    return { value, suffix: `${unitLabel} in ${MONTH_FULL[(m || 1) - 1]}` };
  }
  return { value, suffix: `${unitLabel} this year` };
}
// Every tab's metric extractor + unit label, in ONE place -- drawAdoptCards() below reads this same
// table, by S.adopt.tab, so the cards and the open tab never drift apart. usage/atoms/applied are plain
// sums, safe for computeHero's generic month/year sum-then-nothing-to-divide logic; applied's SECOND
// line (success rate) and duration's hero both go through their own dedicated ratio-aware functions
// above instead, since computeHero's sum would silently average an average for either of them.
const ADOPT_METRICS = {
  usage: { metric: s => s.usageAll, unit: 'hours of active learning' },
  atoms: { metric: s => s.compCount, unit: 'atoms completed' },
  applied: { metric: s => s.applied, unit: 'atoms applied' },
};
function renderUsageTab(series) {
  if (!series.length) return renderBarChart([]);
  const hi = series.reduce((a, b) => b.usageAll > a.usageAll ? b : a), lo = series.reduce((a, b) => b.usageAll < a.usageAll ? b : a);
  const { value, suffix, deltaText } = computeHero(series, S.adopt.period, ADOPT_METRICS.usage.metric, ADOPT_METRICS.usage.unit);
  return heroBlock(Math.round(value).toLocaleString(), suffix, deltaText,
      series.length > 1 ? `Highest usage: <strong>${esc(hi.label)} at ${Math.round(hi.usageAll)} hrs</strong> · Lowest: <strong>${esc(lo.label)} at ${Math.round(lo.usageAll)} hrs</strong>` : '')
    + renderBarChart(series.map(s => ({ period: s.period, label: s.label, segs: [{ value: s.usageExisting, color: 'var(--night)' }, { value: s.usageNew, color: 'var(--teal)', texture: true }] })))
    + LEGEND_NEW_EXISTING;
}
function renderAtomsTab(series) {
  if (!series.length) return renderBarChart([]);
  const totalComp = s => s.compCount;
  const hi = series.reduce((a, b) => totalComp(b) > totalComp(a) ? b : a), lo = series.reduce((a, b) => totalComp(b) < totalComp(a) ? b : a);
  const { value, suffix, deltaText } = computeHero(series, S.adopt.period, ADOPT_METRICS.atoms.metric, ADOPT_METRICS.atoms.unit);
  return heroBlock(Math.round(value).toLocaleString(), suffix, deltaText,
      series.length > 1 ? `Most completed: <strong>${esc(hi.label)} at ${hi.compCount}</strong> · Fewest: <strong>${esc(lo.label)} at ${lo.compCount}</strong>` : '')
    + renderGroupedBarChart(series.map(s => ({ period: s.period, label: s.label, bars: [{ value: s.compCount, color: 'var(--night2)' }, { value: s.notCompCount, color: 'var(--red)', texture: true }] })))
    + `<div class="adopt-legend" style="margin-top:0.8rem"><span><i style="background:var(--night2)"></i>Completed</span><span><i class="texture" style="background-color:var(--red)"></i>Incomplete</span></div>`;
}
function renderAppliedTab(series) {
  if (!series.length) return renderDualAxisChart([]);
  // The hero number is still Atoms Applied (the left-axis bar) -- but the insight line below it is about
  // Success Rate, the chart's OTHER metric, same as Fable's own wording ("Highest success rate: ... ·
  // Lowest: ..."). Only periods that actually have a scored session count toward hi/lo.
  const scored = series.filter(s => s.successRate != null);
  const hi = scored.length ? scored.reduce((a, b) => b.successRate > a.successRate ? b : a) : null;
  const lo = scored.length ? scored.reduce((a, b) => b.successRate < a.successRate ? b : a) : null;
  const { value, suffix, deltaText } = computeHero(series, S.adopt.period, ADOPT_METRICS.applied.metric, ADOPT_METRICS.applied.unit);
  return heroBlock(Math.round(value).toLocaleString(), suffix, deltaText,
      hi ? `Highest success rate: <strong>${esc(hi.label)} at ${Math.round(hi.successRate)}%</strong> · Lowest: <strong>${esc(lo.label)} at ${Math.round(lo.successRate)}%</strong>` : '')
    + renderDualAxisChart(series.map(s => ({ period: s.period, label: s.label, bar: s.applied, line: s.successRate })))
    + `<div class="adopt-legend" style="margin-top:0.8rem"><span><i style="background:var(--night2)"></i>Atoms Applied</span><span><i style="background:var(--teal)"></i>Success Rate</span></div>`;
}
// Average Duration only -- Fable's own "column" list (productdemo/admin_intro.html's .trend-row), not
// the gridline bar charts every other tab uses: one row per period, a thin rounded track, the value
// fixed at the row's own right edge. Kriti, 2026-10-06, revised mid-build: showing BOTH values
// permanently made the right side too busy ("that'll be too many numbers") -- only the completed value
// is ever permanent, sharing the row's own top line with the period label, same as Fable's single-series
// row. The incomplete track sits right underneath, thin, no permanent text of its own, its value only on
// hover -- "so that the two bars for a particular period are very close... the right hand side doesn't
// get too busy." cols: [{period, label, compAvgMin, notCompAvgMin}] (minutes, null when no data yet).
function renderDurationList(cols) {
  if (!cols.length) return '<div class="banner info">No sessions match this view yet.</div>';
  const allVals = cols.flatMap(c => [c.compAvgMin, c.notCompAvgMin]).filter(v => v != null);
  // the track's own capacity: 30 seconds (0.5 min) past the longest session in view, a fixed buffer, not
  // a percentage or a rounded-to-5 ceiling like the gridline charts -- Kriti, 2026-10-06: "so that the
  // dark line never breaks the line frame."
  const ceiling = (allVals.length ? Math.max(...allVals) : 1) + 0.5;
  const pct = v => v == null ? 0 : Math.min(100, (v / ceiling) * 100);
  const fmt = v => v == null ? '—' : `${v.toFixed(1)} min`;
  return `<div class="duration-list">${cols.map(c => `
      <div class="duration-row">
        <div class="duration-row-top"><span>${esc(c.label)}</span><span>${fmt(c.compAvgMin)}</span></div>
        <div class="duration-track"><div class="duration-fill" style="width:${pct(c.compAvgMin).toFixed(1)}%"></div></div>
        <div class="duration-track duration-track-incomplete">
          <div class="duration-fill incomplete texture" style="width:${pct(c.notCompAvgMin).toFixed(1)}%"></div>
          <span class="duration-hover-val" style="${pct(c.notCompAvgMin) > 82 ? 'right:0;top:100%;transform:none;margin-top:2px' : `left:calc(${pct(c.notCompAvgMin).toFixed(1)}% + 8px)`}">${fmt(c.notCompAvgMin)}</span>
        </div>
      </div>`).join('')}</div>`;
}
function renderDurationTab(series) {
  if (!series.length) return renderDurationList([]);
  const { value, suffix } = avgDurationHero(series, S.adopt.period);
  // "Longest/Shortest average session" is the COMPLETED average only -- Kriti, 2026-10-06: "please
  // understand this is longest completed average session, so don't observe the incomplete ones."
  const scored = series.filter(s => s.compAvgMin != null);
  const hi = scored.length ? scored.reduce((a, b) => b.compAvgMin > a.compAvgMin ? b : a) : null;
  const lo = scored.length ? scored.reduce((a, b) => b.compAvgMin < a.compAvgMin ? b : a) : null;
  return heroBlock(value.toFixed(1), suffix, null,
      hi ? `Longest completed average session: <strong>${esc(hi.label)} at ${hi.compAvgMin.toFixed(1)} min</strong> · Shortest: <strong>${esc(lo.label)} at ${lo.compAvgMin.toFixed(1)} min</strong>` : '')
    + renderDurationList(series.map(s => ({ period: s.period, label: s.label, compAvgMin: s.compAvgMin, notCompAvgMin: s.notCompAvgMin })))
    + `<div class="adopt-legend" style="margin-top:0.8rem"><span><i style="background:var(--night2)"></i>Completed</span><span><i class="texture" style="background-color:var(--red)"></i>Incomplete</span></div>`;
}
const ADOPT_TAB_RENDER = { usage: renderUsageTab, atoms: renderAtomsTab, applied: renderAppliedTab, duration: renderDurationTab };

// ONE page, always visible together -- Kriti's correction, 2026-10-05: the three small cards up top are
// never a separate page from the big detail view. The big panel is ALWAYS on screen, directly below the
// cards, and defaults to "Overall" the moment the page opens -- nobody has to click anything to see it.
// Clicking (the mockup's own "drag") a different card swaps the SAME panel's content in place; "Back to
// Overview" just swaps it back to Overall. Nothing here ever navigates to a separate URL/page.
// The "Filter" trigger + slide-out drawer, in Fable's own "+" style (productdemo/admin_intro.html): a "+ Company" /
// "+ Department" / "+ Manager" / "+ User" button each, which opens a scrollable list of tick-boxes of everything
// the caller may see -- tick as many as you like (Kriti, 2026-10-07). Apply narrows the cards, chart, hero and
// feedback to the ticked ones. Within a level any ticked item counts; across levels all must match. The backend
// only ever narrows inside the caller's own scope. A level with fewer than two choices is never offered, so
// someone who can see a single department gets no Filter at all. Comparing organisation vs department etc. is
// deliberately NOT here: that belongs on the later Reports & Insights page.
function focusLevels() {
  const o = S.adopt.focusOptions || {};
  return ADOPT_LEVELS.filter(l => (o[l] || []).length >= 2);
}
function focusIsSet() {
  const f = S.adopt.focus;
  return !!f && ADOPT_LEVELS.some(l => (f[l] || []).length);
}
function focusQuery() {
  if (!focusIsSet()) return '';
  return ADOPT_LEVELS.flatMap(l => (S.adopt.focus[l] || []).map(o => `&focus_${l}=${encodeURIComponent(o.key)}`)).join('');
}
function focusSummary() {
  const labels = ADOPT_LEVELS.flatMap(l => ((S.adopt.focus || {})[l] || []).map(o => o.label));
  return labels.slice(0, 2).join(', ') + (labels.length > 2 ? ` +${labels.length - 2} more` : '');
}
async function ensureFocusOptions() {
  if (S.adopt.focusOptions) return S.adopt.focusOptions;
  try { S.adopt.focusOptions = await reportsApi('/api/reports/adoption-focus-options'); }
  catch (e) { S.adopt.focusOptions = {}; }
  return S.adopt.focusOptions;
}
function openAdoptFilterDrawer() {
  let overlay = $('#adoptDdOverlay'), drawer = $('#adoptDdDrawer');
  if (!drawer) {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="dd-overlay" id="adoptDdOverlay"></div>
      <div class="dd-drawer" id="adoptDdDrawer">
        <div class="dd-drawer-head"><h3>Filter</h3><button class="dd-close-btn" id="adoptDdClose" aria-label="Close">×</button></div>
        <div class="dd-drawer-body" id="adoptDdBody"></div>
        <div class="dd-drawer-foot"><button class="dd-go-btn" id="adoptDdGo">Apply</button></div>
      </div>`);
    overlay = $('#adoptDdOverlay'); drawer = $('#adoptDdDrawer');
    const close = () => { overlay.classList.remove('open'); drawer.classList.remove('open'); };
    overlay.onclick = close;
    $('#adoptDdClose').onclick = close;
  }
  const opts = S.adopt.focusOptions || {};
  const levels = focusLevels();
  const picked = {};
  levels.forEach(l => { picked[l] = new Set(((S.adopt.focus || {})[l] || []).map(o => o.key)); });
  const toggleText = (l, open) => `${open ? '− ' : '+ '}${titleCase(l)}${picked[l].size ? ` (${picked[l].size})` : ''}`;
  const body = $('#adoptDdBody');
  body.innerHTML = levels.map(l => `
    <div class="ri-dd-item${picked[l].size ? ' open' : ''}" data-item="${l}">
      <button type="button" class="ri-dd-toggle" data-toggle="${l}">${toggleText(l, picked[l].size > 0)}</button>
      <div class="ri-dd-panel">${(opts[l] || []).map(o => `<label><input type="checkbox" data-level="${l}" value="${esc(o.key)}"${picked[l].has(o.key) ? ' checked' : ''}>${esc(o.label)}</label>`).join('')}</div>
    </div>`).join('');
  body.onclick = e => {
    const t = e.target.closest('[data-toggle]');
    if (!t) return;
    const item = t.parentElement, open = item.classList.toggle('open');
    t.textContent = toggleText(t.dataset.toggle, open);
  };
  body.onchange = e => {
    const box = e.target.closest('input[data-level]');
    if (!box) return;
    const l = box.dataset.level;
    box.checked ? picked[l].add(box.value) : picked[l].delete(box.value);
    $('[data-toggle="' + l + '"]', body).textContent = toggleText(l, true);
  };
  $('#adoptDdGo').onclick = () => {
    const f = {};
    levels.forEach(l => { const sel = (opts[l] || []).filter(o => picked[l].has(o.key)); if (sel.length) f[l] = sel; });
    S.adopt.focus = Object.keys(f).length ? f : null;
    overlay.classList.remove('open'); drawer.classList.remove('open');
    drawAdoptPanel(); drawAdoptCards();
  };
  overlay.classList.add('open'); drawer.classList.add('open');
}

// The caller's real fiscal-year-start month, fetched once and cached on S.adopt -- shared by the cards
// AND the panel so neither one ever guesses. Kriti, 2026-10-07: the cards used to fire off with a
// January placeholder before this was known, so a company on (say) an April fiscal year could show one
// number on the cards and a DIFFERENT one on the panel below, every time the page first loaded -- "it's
// showing wrong data... it can't do that." Fixed by never letting either one fetch its rows before this
// is resolved -- see renderAdoption() below, which now awaits this FIRST, before either is drawn.
async function ensureFiscalStartMonth() {
  if (S.adopt.fiscalStartMonth !== null) return S.adopt.fiscalStartMonth;
  try { S.adopt.fiscalStartMonth = (await reportsApi('/api/reports/adoption-fiscal-year-start')).fiscal_year_start_month; }
  catch (e) { S.adopt.fiscalStartMonth = 1; }
  return S.adopt.fiscalStartMonth;
}

async function renderAdoption() {
  $('#view').innerHTML = `<div class="um-page-head"><div><h1 class="um-title">Adoption Overview</h1></div></div>
    <div id="adoptCards" class="adopt-cards"></div>
    <div id="adoptPanel" class="panel adopt-droptarget"></div>
    <div id="adoptFeedbackPanel" class="panel"></div>`;
  // Real HTML5 drag-and-drop onto the panel (Kriti's explicit call, 2026-10-05: a click alone was not
  // what she asked for) -- these two listeners live on the STABLE panel element itself, set once here,
  // not inside drawAdoptPanel() (which only replaces the panel's innerHTML on every redraw).
  const panel = $('#adoptPanel');
  panel.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; panel.classList.add('drag-over'); };
  panel.ondragleave = () => panel.classList.remove('drag-over');
  panel.ondrop = e => {
    e.preventDefault(); panel.classList.remove('drag-over');
    const key = e.dataTransfer.getData('text/plain');
    if (ADOPT_TRACKS[key]) { S.adopt.active = key; drawAdoptCards(); drawAdoptPanel(); }
  };
  await Promise.all([ensureFiscalStartMonth(), ensureFocusOptions()]);   // resolved BEFORE either draw below ever fetches a single row
  drawAdoptCards();
  drawAdoptPanel();
}

function drawAdoptCards() {
  const cardsEl = $('#adoptCards');
  // Applied Learning is the one tab with two genuinely different metrics (atoms applied, a count; success
  // rate, a percentage) -- Kriti, 2026-10-06: "you've got two atoms applied in October... you'll have to
  // show me two lines... application success rate." Every other tab still shows its one line.
  const isApplied = S.adopt.tab === 'applied';
  cardsEl.innerHTML = Object.keys(ADOPT_TRACKS).map(key => {
    const t = ADOPT_TRACKS[key];
    return `<button class="adopt-card${key === S.adopt.active ? ' active' : ''}${isApplied ? ' two-metric' : ''}" data-key="${key}" draggable="true">
      <div class="adopt-card-top"><div class="stat-icon ${t.iconClass}">${icon(t.icon)}</div><div class="adopt-card-label">${esc(t.label)}</div></div>
      <div class="adopt-card-hero"><span class="adopt-card-num" id="adoptNum_${key}"><span class="spinner"></span></span><span class="adopt-card-sub" id="adoptSub_${key}"></span></div>
      ${isApplied ? `<div class="adopt-card-hero adopt-card-hero2"><span class="adopt-card-num" id="adoptNum2_${key}"></span><span class="adopt-card-sub" id="adoptSub2_${key}"></span></div>` : ''}
    </button>`;
  }).join('');
  $$('[data-key]', cardsEl).forEach(b => {
    b.onclick = () => { S.adopt.active = b.dataset.key; drawAdoptCards(); drawAdoptPanel(); };
    b.ondragstart = e => { e.dataTransfer.setData('text/plain', b.dataset.key); e.dataTransfer.effectAllowed = 'move'; b.classList.add('dragging'); };
    b.ondragend = () => b.classList.remove('dragging');
  });
  // Each card's own total, fetched independently -- one slow or failed track never blocks the other two.
  // Synced to whichever period/tab/drill-down level the main panel below is currently showing (Kriti,
  // 2026-10-06: "the two are sort of connected" -- and later the same day: the cards must follow the
  // Filter drawer's level too, the same way they already follow the period toggle) -- the SAME
  // computeHero() the big hero uses, so a card and the open tab can never say two different things.
  const isDuration = S.adopt.tab === 'duration';
  const tabInfo = ADOPT_METRICS[S.adopt.tab] || ADOPT_METRICS.usage;
  Object.keys(ADOPT_TRACKS).forEach(async key => {
    const numEl = $('#adoptNum_' + key), subEl = $('#adoptSub_' + key);
    const numEl2 = isApplied ? $('#adoptNum2_' + key) : null, subEl2 = isApplied ? $('#adoptSub2_' + key) : null;
    try {
      const rows = await reportsApi(`/api/reports/adoption-overview?track=${ADOPT_TRACKS[key].track}&level=${S.adopt.level}&period=${S.adopt.period}${focusQuery()}`);
      const series = seriesFromRows(rows, S.adopt.period, await ensureFiscalStartMonth());
      const { value, suffix } = isDuration ? avgDurationHero(series, S.adopt.period) : computeHero(series, S.adopt.period, tabInfo.metric, tabInfo.unit);
      if (numEl) numEl.textContent = isDuration ? value.toFixed(1) : Math.round(value).toLocaleString();
      if (subEl) subEl.textContent = suffix;
      if (isApplied) {
        const sr = successRateHero(series, S.adopt.period);
        if (numEl2) numEl2.textContent = sr.value + '%';
        if (subEl2) subEl2.textContent = sr.suffix;
      }
    } catch (e) {
      if (numEl) numEl.textContent = '—';
    }
  });
}

// ════════════ USER FEEDBACK (NPS) -- Kriti, 2026-10-07 ════════════
// Under the chart, its OWN Month/Quarter/Year toggle (independent of the chart's), following the same single
// drill-down, the same active card (Self-Initiated / Recommended / Overall) and, for Recommended, the same
// assigned-by choice. NPS = % promoters - % detractors off the end-of-track 10-point score; the raw
// promoter/passive/detractor counts are summed across the window FIRST and the score worked out once from
// the totals -- never an average of already-computed scores. Quarter shows the current quarter, like every
// other hero on this page.
function feedbackWindow(series, period) {
  const pts = period === 'quarter' ? series.slice(-1) : series;
  const t = pts.reduce((a, s) => ({ p: a.p + s.npsPromoters, m: a.m + s.npsPassives, d: a.d + s.npsDetractors, n: a.n + s.npsScored }), { p: 0, m: 0, d: 0, n: 0 });
  let when = period === 'quarter' ? 'this quarter' : 'this year';
  if (period === 'month' && series.length) { const [, mo] = (series[series.length - 1].period || '').split('-').map(Number); when = `in ${MONTH_FULL[(mo || 1) - 1]}`; }
  return { ...t, nps: t.n ? ((t.p - t.d) / t.n) * 100 : null, when };
}
function npsTag(n) {
  if (n >= 50) return { text: 'Excellent', cls: 'great' };
  if (n >= 30) return { text: 'Good', cls: 'good' };
  if (n >= 0) return { text: 'Fair', cls: 'fair' };
  return { text: 'Needs attention', cls: 'poor' };
}
function renderFeedbackBody(series, period) {
  const w = feedbackWindow(series, period);
  if (!w.n) return `<div class="adopt-fb-empty">No feedback has come in ${esc(w.when)} yet.</div>`;
  const tag = npsTag(w.nps), pct = c => (c / w.n) * 100;
  const seg = (cls, c) => c ? `<span class="${cls}" style="flex:${c} 1 0"></span>` : '';
  const row = (cls, label, range, c) => `<div class="adopt-fb-legend-row"><i class="${cls}"></i><span class="lbl">${label} <small>${range}</small></span><span class="val">${c} <small>${Math.round(pct(c))}%</small></span></div>`;
  return `<div class="adopt-fb-body">
      <div class="adopt-fb-hero">
        <div class="adopt-fb-num">${Math.round(w.nps)}</div>
        <div class="adopt-fb-label">NPS Score <span class="adopt-fb-tag ${tag.cls}">${tag.text}</span></div>
        <div class="adopt-fb-meta">${w.n} ${w.n === 1 ? 'response' : 'responses'} ${esc(w.when)}</div>
      </div>
      <div class="adopt-fb-dist">
        <div class="adopt-fb-bar">${seg('pro', w.p)}${seg('pas', w.m)}${seg('det', w.d)}</div>
        <div class="adopt-fb-legend">${row('pro', 'Promoters', '9–10', w.p)}${row('pas', 'Passives', '7–8', w.m)}${row('det', 'Detractors', '0–6', w.d)}</div>

    </div>

}
async function drawAdoptFeedback() {
  const box = $('#adoptFeedbackPanel'); if (!box) return;
  const t = ADOPT_TRACKS[S.adopt.active];
  const assigned = t.hasAssignedBy ? S.adopt.assignedBy : '';
  const sig = [t.track, S.adopt.fbPeriod, assigned, JSON.stringify(S.adopt.focus)].join('|');
  if (S.adopt.fbSig === sig && box.dataset.ready) return;
  S.adopt.fbWant = sig;
  box.dataset.ready = '';
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
      <h3 style="font-size:1.05rem;font-weight:700;color:var(--night);text-transform:none;letter-spacing:0;margin:0">User Feedback</h3>
      <div class="adopt-seg" id="adoptFbSeg">${['month', 'quarter', 'year'].map(p => `<button data-fbperiod="${p}" class="${p === S.adopt.fbPeriod ? 'active' : ''}">${titleCase(p)}</button>`).join('')}</div>
    </div>
    <div id="adoptFbBody" class="loading-block"><div class="spinner"></div></div>`;
  $$('[data-fbperiod]', box).forEach(b => b.onclick = () => { S.adopt.fbPeriod = b.dataset.fbperiod; drawAdoptFeedback(); });
  try {
    const fiscalStartMonth = await ensureFiscalStartMonth();
    let path = `/api/reports/adoption-overview?track=${t.track}&level=${S.adopt.level}&period=${S.adopt.fbPeriod}${focusQuery()}`;
    if (assigned) path += '&assigned_by=' + encodeURIComponent(assigned);
    const rows = await reportsApi(path);
    if (S.adopt.fbWant !== sig) return;   // the person moved on while this was loading
    const body = $('#adoptFbBody'); if (!body) return;
    body.classList.remove('loading-block');
    body.innerHTML = renderFeedbackBody(seriesFromRows(rows, S.adopt.fbPeriod, fiscalStartMonth), S.adopt.fbPeriod);
    S.adopt.fbSig = sig; box.dataset.ready = '1';
  } catch (e) {
    const body = $('#adoptFbBody'); if (body && S.adopt.fbWant === sig) { body.classList.remove('loading-block'); body.innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
  }
}

async function drawAdoptPanel() {
  const key = S.adopt.active, t = ADOPT_TRACKS[key];
  const panel = $('#adoptPanel');
  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:0.3rem;flex-wrap:wrap">
      <h3 style="font-size:1.05rem;font-weight:700;color:var(--night);text-transform:none;letter-spacing:0">${esc(t.label)}</h3>
      ${key !== 'overall' ? `<button class="adopt-back" id="adoptBackBtn">${icon('out')} Back to Overview</button>` : ''}
    </div>
    <div class="adopt-controls">
      <div class="adopt-seg" id="adoptPeriodSeg">${['month', 'quarter', 'year'].map(p => `<button data-period="${p}" class="${p === S.adopt.period ? 'active' : ''}">${titleCase(p)}</button>`).join('')}</div>
      ${focusLevels().length || focusIsSet() ? `<button class="ri-dd-trigger" id="adoptFilterTrigger">${icon('filter')} Filter</button>` : ''}
      ${focusIsSet() ? `<span class="adopt-focus-chip">Showing: <strong>${esc(focusSummary())}</strong><button type="button" id="adoptFocusClear" aria-label="Show everything">×</button></span>` : ''}

    </div>
    <div class="adopt-tabs" id="adoptTabsRow">${ADOPT_TABS.map(tb => `<button data-tab="${tb.key}" class="${tb.key === S.adopt.tab ? 'active' : ''}">${esc(tb.label)}</button>`).join('')}</div>
    <div id="adoptBody" class="loading-block"><div class="spinner"></div></div>`;
  if (key !== 'overall') $('#adoptBackBtn').onclick = () => { S.adopt.active = 'overall'; drawAdoptCards(); drawAdoptPanel(); };
  $$('[data-period]', $('#adoptPeriodSeg')).forEach(b => b.onclick = () => { S.adopt.period = b.dataset.period; drawAdoptPanel(); drawAdoptCards(); });
  if ($('#adoptFilterTrigger')) $('#adoptFilterTrigger').onclick = openAdoptFilterDrawer;
  if ($('#adoptFocusClear')) $('#adoptFocusClear').onclick = () => { S.adopt.focus = null; drawAdoptPanel(); drawAdoptCards(); };
  $$('[data-tab]', $('#adoptTabsRow')).forEach(b => b.onclick = () => { S.adopt.tab = b.dataset.tab; drawAdoptPanel(); drawAdoptCards(); });
  if (t.hasAssignedBy) {
    const sel = $('#adoptAssignedBy');
    sel.onchange = e => { S.adopt.assignedBy = e.target.value; drawAdoptPanel(); };
    // A dropdown of REAL names only, never free text -- Kriti's explicit call, 2026-10-05: "what you're
    // showing has to always be verified with the admin's rights." The options come from the server's own
    // scope check (the exact same one build_report() uses below), so a department admin can never even
    // SEE a name from outside their own department, let alone type one in. Cached on S.adopt for the
    // session -- it rarely changes and every tab/period/level switch would otherwise re-fetch it.
    (async () => {
      try {
        if (!S.adopt.assignedByOptions) S.adopt.assignedByOptions = await reportsApi('/api/reports/adoption-assigned-by-options');
        const cur = $('#adoptAssignedBy'); if (!cur) return;   // the panel may have moved on by the time this resolves
        cur.innerHTML = '<option value="">Assigned by: everyone</option>' + S.adopt.assignedByOptions.map(n => `<option value="${esc(n)}" ${n === S.adopt.assignedBy ? 'selected' : ''}>${esc(n)}</option>`).join('');
      } catch (e) { /* the "everyone" option still works */ }
    })();
  }
  drawAdoptFeedback();   // its own card + its own toggle; a no-op unless the track / drill-down / assigned-by changed
  try {
    const fiscalStartMonth = await ensureFiscalStartMonth();   // same cached fact the cards now also wait on
    let path = `/api/reports/adoption-overview?track=${t.track}&level=${S.adopt.level}&period=${S.adopt.period}${focusQuery()}`;
    if (t.hasAssignedBy && S.adopt.assignedBy) path += '&assigned_by=' + encodeURIComponent(S.adopt.assignedBy);
    const rows = await reportsApi(path);
    // loading-block's own 3rem padding (meant only for the spinner) was being left on this div after
    // real content replaced it -- the dead space Kriti flagged, 2026-10-06, between the tabs and the
    // hero number. Real content gets this div's padding back to normal.
    $('#adoptBody').classList.remove('loading-block');
    $('#adoptBody').innerHTML = ADOPT_TAB_RENDER[S.adopt.tab](seriesFromRows(rows, S.adopt.period, fiscalStartMonth));
  } catch (e) {
    $('#adoptBody').innerHTML = `<div class="banner">${esc(e.message)}</div>`;
  }
}

// ════════════ LEARNING FRICTION (Reports & Insights) ════════════
// The Learning Friction report, row 04 of Reports & Insights (Kriti, 2026-10-09). Everything is read from wotg-reports
// /api/reports/driver-report (+ -workplace, -options) with the login token -- the page does no maths of its own and
// never decides who may see what: the backend only ever answers inside the caller's own scope.
// TOP HALF (cards, Friction Share Over Time, Key Insights, How Friction Compounds): two independent Month/Quarter/Year
// toggles (the four cards, and the chart -- Compounds follows the chart), one Filter by Reflector and one Drill Down.
// BOTTOM HALF ("Friction x Workplace Challenge"): its OWN toggle, Filter by Reflector and Drill Down (company and
// department only -- never manager, user or assigner, privacy) and its OWN request; the top half never touches it.
// All names live in this one object so nothing here can collide with the Adoption Overview code.
const LF = (() => {
  const COLORS = { confidence: '#0F766E',   // the deep teal (Kriti, 2026-10-09: the brighter teal was too bright for the eyes -- reverted)
     mindset: '#E45756', situation: '#D97706', knowledge: '#4A6FA5' };   // knowledge: a duller steel blue (Kriti, 2026-10-09: the old #2563EB was too sharp)

  const PERIODS = [['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']];
  const LEVELS = [['company', 'Company'], ['department', 'Department'], ['manager', 'Manager'], ['user', 'User'], ['assigner', 'Assigner']];
  const WC_LEVELS = [['company', 'Company'], ['department', 'Department']];

  const DD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>';
  const DD_TOOLTIP = '<div class="dd-tooltip"><strong>Reveal Insights from Every Angle</strong><span>Analyze learning insights across different organizational dimensions. Slice data vertically and horizontally to uncover trends, compare groups, and identify where capability gaps and strengths exist.</span></div>';
  const RF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const BUBBLE_MIN = 22, BUBBLE_MAX = 60, PCT_MIN = 12, PCT_MAX = 44;
  const st = { period: 'month',   // ONE toggle for the whole Learning Friction section: the cards, the chart and Compounds move together (Kriti, 2026-10-09)
                focus: { company: [], department: [], manager: [], user: [], assigner: [] },
               wc: { company: [], department: [] }, reflectors: [], options: null, data: null, error: null, loading: true, ddMode: 'page',
               wcPeriod: 'month', wcReflectors: [], wcData: null, wcError: null, wcLoading: true, rfMode: 'page' };

  function quarterMonthRange(qNum, fsm) { const m0 = (fsm - 1 + (qNum - 1) * 3) % 12, m2 = (m0 + 2) % 12; return `${MONTH_ABBR[m0]}–${MONTH_ABBR[m2]}`; }
  function bucketLabel(key, period, fsm) {

    if (period === 'year') { const [y, m] = key.split('-').map(Number); return `${MONTH_ABBR[m - 1]} '${String(y).slice(2)}`; }
    const [fy, q] = key.split('-Q'); return `Q${q} '${String(fy).slice(2)} (${quarterMonthRange(Number(q), fsm || 1)})`;
  }
  function cardsNote(d) {

  }
  function params() {

  function insights(data) {

  function page() {
    const d = st.data, summary = focusSummary();
    const head = `<div class="um-page-head"><div><button class="ri-back-btn" onclick="location.hash='#reports'" style="margin-bottom:0.7rem;">&larr; Reports &amp; Insights</button><h1 class="um-title">Learning Friction</h1></div>
      <div class="fr-controls-right">${periodToggle('page')}
        <button class="rf-inline-trigger" onclick="LF.toggleReflector('page')">${RF_ICON}Filter by Reflector${st.reflectors.length ? `<span class="rf-count">${st.reflectors.length}</span>` : ''}</button>
        <button class="ri-dd-trigger" onclick="LF.toggleDrill('page')">${DD_ICON}Drill Down${DD_TOOLTIP}</button>
      </div></div>
      ${summary.length ? `<div class="fr-filter-tag">Filtered by: ${summary.map(esc).join(', ')} <button onclick="LF.clearFocus()">&times;</button></div>` : ''}
      ${st.reflectors.length ? `<div class="fr-filter-tag">Reflectors: ${st.reflectors.length <= 3 ? st.reflectors.map(esc).join(', ') : st.reflectors.length + ' chosen'} <button onclick="LF.clearReflectors()">&times;</button></div>` : ''}`;
    // The toggles are drawn in EVERY state (loading, error, data) so the page never changes shape under the reader.
    const note = d ? '' : `<div class="fr-state">${esc(st.error ? friendly(st.error) : 'Loading…')}</div>`;
    return `${head}
      ${d ? areaCards(d.cards, d.areas, d) : note}
      <div class="rh-graph-card" style="margin-top:1.8rem;">
        <div class="rh-graph-controls" style="justify-content:space-between; align-items:center;"><h3 class="rh-section-title" style="margin-bottom:0;">Friction Share Over Time</h3></div>
        ${d ? trendChart(d) : '<div class="fr-chart-empty">&nbsp;</div>'}
      </div>
      ${d ? `<div style="margin-top:1.4rem;">${insights(d)}</div>
      ${compoundsBlock(d)}` : ''}
      <div id="lfWc"></div>
      ${d && st.error ? `<div class="fr-state" style="margin-top:1rem;">${esc(friendly(st.error))}</div>` : ''}`;
  }
  function paint() {
    const main = $('#lfMain'); if (!main) return;
    main.innerHTML = page();
    main.classList.toggle('fr-loading', st.loading && !!st.data);
    requestAnimationFrame(positionThumbs);
    bindTips(); paintWc();
  }
  function positionThumbs() {
    document.querySelectorAll('.fr-period-toggle').forEach(t => {
      const a = t.querySelector('span.active'), th = t.querySelector('.period-toggle-thumb');
      if (a && th) { th.style.left = a.offsetLeft + 'px'; th.style.width = a.offsetWidth + 'px'; }
    });
  }
  // hover over a bar: the counts behind it, in a tip of our own (never the browser's grey title box)
  function bindTips() {
    const tip = $('#lfTip'); if (!tip || !st.data) return;
    document.querySelectorAll('#lfMain .fr-hit').forEach(row => {
      row.addEventListener('mousemove', e => {
        const b = st.data.trend.buckets[Number(row.dataset.i)];
        tip.innerHTML = `<b>${esc(bucketLabel(b.bucket, st.data.trend_period, st.data.fiscal_start_month))}</b>${st.data.areas.map(a => `<div><i style="background:${COLORS[a.key]}"></i>${b.areas[a.key].percent}% <span class="muted">(${b.areas[a.key].count})</span></div>`).join('')}<div class="muted" style="margin-top:0.3rem">${b.sessions} session${b.sessions === 1 ? '' : 's'} · ${b.identifications} identifications</div>`;
        tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
        tip.classList.add('show');
      });
      row.addEventListener('mouseleave', () => tip.classList.remove('show'));
    });
  }
  function bindBubbles() {
    const w = st.wcData, panel = $('#wcPanel'); if (!w || !panel) return;
    const show = b => {
      const arena = w.arenas[Number(b.dataset.ai)], area = w.areas.find(a => a.key === b.dataset.area);
      document.querySelectorAll('#lfWc .bubble.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
      panel.innerHTML = panelHtml(arena, area); panel.style.borderLeftColor = COLORS[area.key];
    };
    document.querySelectorAll('#lfWc .bubble[data-ai]').forEach(b => { b.addEventListener('mouseenter', () => show(b)); b.addEventListener('focus', () => show(b)); b.addEventListener('click', () => show(b)); });
  }

  // ---- drawers (built once, kept in <body> like the Adoption filter drawer) ----
  function ensureDrawers() {
    if ($('#lfDdDrawer')) return;
    const x = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    document.body.insertAdjacentHTML('beforeend', `
      <div class="dd-overlay" id="lfDdOverlay" onclick="LF.toggleDrill()"></div>
      <div class="dd-drawer" id="lfDdDrawer"><div class="dd-drawer-head"><h3 id="lfDdTitle">Drill Down</h3><button class="dd-close-btn" onclick="LF.toggleDrill()" aria-label="Close">${x}</button></div>
        <div class="dd-drawer-body" id="lfDdBody"></div><div class="dd-drawer-foot"><button class="dd-go-btn" onclick="LF.applyDrill()">Go</button></div></div>
      <div class="dd-overlay" id="lfRfOverlay" onclick="LF.toggleReflector()"></div>
      <div class="dd-drawer" id="lfRfDrawer"><div class="dd-drawer-head"><h3>Filter By Reflector</h3><button class="dd-close-btn" onclick="LF.toggleReflector()" aria-label="Close">${x}</button></div>
        <div class="dd-drawer-body" id="lfRfBody"></div><div class="dd-drawer-foot"><button class="dd-go-btn" onclick="LF.applyReflector()">Go</button></div></div>
      <div class="fr-tip" id="lfTip"></div>`);
  }
  function drillBody() {
    const wc = st.ddMode === 'wc', state = wc ? st.wc : st.focus;
    const levels = (wc ? WC_LEVELS : LEVELS).filter(([l]) => st.options && (st.options[l] || []).length >= 2);
    $('#lfDdBody').innerHTML = levels.length ? levels.map(([l, name]) => {
      const open = state[l].length > 0;
      return `<div class="ri-dd-item ${open ? 'open' : ''}" data-level="${l}"><button class="ri-dd-toggle" data-label="${name}" onclick="LF.toggleDD(this)">${open ? '− ' : '+ '}${name}</button>
        <div class="ri-dd-panel">${st.options[l].map(o => `<label><input type="checkbox" value="${esc(o.key)}" ${state[l].includes(o.key) ? 'checked' : ''}>${esc(o.label)}</label>`).join('')}</div></div>`;
    }).join('') : '<div class="ri-dd-hint">There is nothing to drill into yet — this view has only one choice at every level.</div>';
  }
  function reflectorBody() {
    const chosen = st.rfMode === 'wc' ? st.wcReflectors : st.reflectors;
    $('#lfRfBody').innerHTML = ((st.options && st.options.reflectors) || []).map(g => {
      const open = g.reflectors.some(r => chosen.includes(r));
      return `<div class="ri-dd-item ${open ? 'open' : ''}"><button class="ri-dd-toggle" data-label="${esc(g.capability)}" onclick="LF.toggleDD(this)">${open ? '− ' : '+ '}${esc(g.capability)}</button>
        <div class="ri-dd-panel">${g.reflectors.map(r => `<label><input type="checkbox" value="${esc(r)}" ${chosen.includes(r) ? 'checked' : ''}>${esc(r)}</label>`).join('')}</div></div>`;
    }).join('');
  }

  return {
    async render() {
      ensureDrawers();
      $('#view').innerHTML = '<div id="lfMain"></div>';
      paint();
      if (!st.options) { try { st.options = await reportsApi('/api/reports/driver-report-options'); } catch (e) { st.error = e.message; } }
      load(); loadWc();
    },
    setPeriod(which, k) { if (which === 'wc') { st.wcPeriod = k; loadWc(); } else { st.period = k; load(); } },
    toggleDD(btn) { const open = btn.parentElement.classList.toggle('open'); btn.textContent = (open ? '− ' : '+ ') + btn.dataset.label; },
    toggleDrill(mode) {
      if (typeof mode === 'string') st.ddMode = mode;
      $('#lfDdTitle').textContent = st.ddMode === 'wc' ? 'Drill Down: Workplace Challenge' : 'Drill Down';
      const open = $('#lfDdDrawer').classList.toggle('open');
      $('#lfDdOverlay').classList.toggle('open', open);
      document.body.style.overflow = open ? 'hidden' : '';
      if (open) drillBody();
    },
    applyDrill() {
      const state = st.ddMode === 'wc' ? st.wc : st.focus;
      (st.ddMode === 'wc' ? WC_LEVELS : LEVELS).forEach(([l]) => {
        const item = document.querySelector(`#lfDdBody .ri-dd-item[data-level="${l}"]`);
        if (item) state[l] = Array.from(item.querySelectorAll('input:checked')).map(cb => cb.value);
      });
      LF.toggleDrill(); if (st.ddMode === 'wc') loadWc(); else load();
    },
    toggleReflector(mode) {
      if (typeof mode === 'string') st.rfMode = mode;
      const open = $('#lfRfDrawer').classList.toggle('open');
      $('#lfRfOverlay').classList.toggle('open', open);
      document.body.style.overflow = open ? 'hidden' : '';
      if (open) reflectorBody();
    },
    applyReflector() {
      const picked = Array.from(document.querySelectorAll('#lfRfBody input:checked')).map(cb => cb.value);
      if (st.rfMode === 'wc') { st.wcReflectors = picked; LF.toggleReflector(); loadWc(); } else { st.reflectors = picked; LF.toggleReflector(); load(); }
    },
    clearFocus() { LEVELS.forEach(([l]) => st.focus[l] = []); load(); },
    clearWc() { WC_LEVELS.forEach(([l]) => st.wc[l] = []); loadWc(); },
    clearWcReflectors() { st.wcReflectors = []; loadWc(); },
    clearReflectors() { st.reflectors = []; load(); },
    repaint() { if ($('#lfMain') && st.data) paint(); },
  };
})();
let _lfResize; addEventListener('resize', () => { clearTimeout(_lfResize); _lfResize = setTimeout(() => LF.repaint(), 150); });

// ════════════ REPORTS & INSIGHTS (the list of reports) ════════════
// Fable's report list (productdemo/reports_insights.html, level 1) with Adoption Overview moved in as 01 (Kriti,
// 2026-10-09). Only the live reports are links (a green number); the rest are faded with a gray "Coming Soon" tag.
const REPORTS_BACK = '<button class="ri-back-btn" onclick="location.hash=\'#reports\'" style="margin-bottom:0.7rem;">&larr; Reports &amp; Insights</button>';
const REPORT_ROWS = [
  { label: 'Adoption Overview', desc: 'See who is using Wisdom on the GO!, how often, and where adoption is growing.', hash: '#reports/adoption' },
  { label: 'Competency Dashboard', desc: 'Understand learner engagement, learning investment and proficiency across every organizational competency. Drill down into individual competencies to identify strengths, development priorities and adoption trends.' },
  { label: 'Capability Landscape', desc: 'Explore the organization’s capability profile to identify where human capabilities are strongest, where they are underdeveloped, and how they are evolving across teams and employee groups.' },
  { label: 'Learning Friction', desc: 'Identify the underlying barriers preventing employees from demonstrating critical human skills. Analyze friction across the four learning drivers to understand where development efforts should be focused.', hash: '#reports/friction' },
  { label: 'Reflector Insights', desc: 'Analyze Reflector demand to identify the human skills most frequently diagnosed, recommended and mapped across organizational competencies and learning initiatives. Explore demand, proficiency and growth trends over time.' },
  { label: 'Workplace Challenges', desc: 'Discover the most common workplace situations employees seek help with, helping identify recurring business challenges, emerging trends and areas requiring organizational attention.' },
];
function renderReportsHub() {
  $('#view').innerHTML = `<div class="um-page-head"><div><h1 class="um-title">Reports &amp; Insights</h1></div></div>
    <div class="report-list">${REPORT_ROWS.map((r, i) => `
      <div class="report-row ${r.hash ? 'clickable' : 'coming-soon'}" style="border-left-color:${i % 2 === 0 ? 'var(--green)' : 'var(--night)'}" ${r.hash ? `onclick="location.hash='${r.hash}'" role="link" tabindex="0"` : ''}>
        <div class="report-row-index">${String(i + 1).padStart(2, '0')}</div>
        <div class="report-row-text"><h3>${esc(r.label)}</h3><p>${esc(r.desc)}</p></div>
        ${r.hash ? '' : '<span class="report-soon-tag">Coming Soon</span>'}
      </div>`).join('')}</div>`;
}

// ════════════ NAVIGATION, ROUTER, START-UP ════════════
const NAV = [
  { key: 'users', label: 'User Management', icon: 'users', hash: '#users' },
  { key: 'learning', label: 'Learning Management', icon: 'book', hash: '#learning/assign' },
  { key: 'reports', label: 'Reports & Insights', icon: 'chart', hash: '#reports' },
  { key: 'impact', label: 'Business Impact', icon: 'trend', hash: '#soon/impact', soon: true },
];
function drawNav(activeKey) {
  $('#adminNav').innerHTML = NAV.map(n => `<button class="admin-nav-item ${n.key === activeKey ? 'active' : ''}" data-hash="${n.hash}">${icon(n.icon)} ${esc(n.label)}${n.soon ? '<span class="soon">Soon</span>' : ''}</button>`).join('') +
    `<div class="admin-nav-divider"></div>
     <button class="admin-nav-item" id="navHelp">${icon('help')} Help &amp; information <span class="soon">Soon</span></button>`;
  $$('[data-hash]', $('#adminNav')).forEach(b => b.onclick = () => { location.hash = b.dataset.hash; if (window.innerWidth <= 960) $('#adminSidebar').classList.remove('open'); });
  $('#navHelp').onclick = openHelp;  // Log out lives ONLY in the photo drop-down (Kriti, 2026-10-03), exactly like the user page
}
// Company Settings (new 2026-10-06): one setting, right now -- which month this company's fiscal
// year starts in. Lives in the profile drop-down, never under User Management (Kriti's explicit call:
// "User Management is about users"). A Company Admin sees only their own company (or companies, for a
// multi-company CA); the super admin picks from every company on file.
async function openCompanySettings(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  $('#profileDropdown').classList.remove('open');
  const cos = scopeCompanies();
  if (!cos.length) { toast('No company is available to configure.', 'warn'); return; }
  const m = openModal({
    title: 'Company Settings', sub: 'Right now, one setting: when this company’s fiscal year starts.',
    html: `
      ${cos.length > 1 ? `<div class="field"><label>Company</label><select id="csCompany">${cos.map(c => `<option value="${esc(c.company_code)}">${esc(c.company_name)}</option>`).join('')}</select></div>` : `<input type="hidden" id="csCompany" value="${esc(cos[0].company_code)}">`}
      <div class="field"><label>Fiscal year starts in</label><select id="csMonth">${MONTH_ABBR.map((mo, i) => `<option value="${i + 1}">${mo}</option>`).join('')}</select></div>
      <div id="csStatus" style="margin-top:0.8rem;font-size:0.85rem;color:var(--grey3)"></div>`,
  });
  const loadCurrent = async () => {
    const code = $('#csCompany').value;
    $('#csStatus').textContent = 'Loading…';
    try {
      const r = await api('/api/admin/company-settings?company_code=' + encodeURIComponent(code));
      $('#csMonth').value = String(r.fiscal_year_start_month);
      $('#csStatus').textContent = '';
    } catch (err) { $('#csStatus').textContent = err.message; }
  };
  if (cos.length > 1) $('#csCompany').onchange = loadCurrent;
  await loadCurrent();
  setFoot(m, [
    { label: 'Cancel', cls: 'btn-outline', onClick: () => m.close() },
    { label: 'Save', cls: 'btn-primary-add', onClick: async (btn) => {
        btn.disabled = true;
        try {
          await api('/api/admin/company-settings', { method: 'POST', json: { company_code: $('#csCompany').value, fiscal_year_start_month: Number($('#csMonth').value) } });
          toast('Company Settings saved.');
          S.adopt.fiscalStartMonth = null;   // next adoption-report fetch picks up the new value
          m.close();
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      } },
  ]);
}

function openHelp() {
  const m = openModal({ title: 'Help & information', size: 'narrow', html: `<div class="banner"><strong>Raise a ticket — coming soon.</strong> Soon you will be able to ask for help, or request a change such as a new Company Admin, right from here.</div><p style="font-size:0.88rem;color:var(--night2)">Until then, email <a href="mailto:inquiry@korporatewisdom.com" style="text-decoration:underline">inquiry@korporatewisdom.com</a>.</p>` });
  setFoot(m, [{ label: 'Close', cls: 'btn-primary-add', onClick: () => m.close() }]);
}
function logOut() {
  // Kill the login keycard on the server too (best effort -- logging out must never get stuck on a network error).
  let token = ''; try { token = localStorage.getItem('login_token') || ''; } catch (e) {}
  if (token) { try { fetch(API_BASE + '/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, keepalive: true }); } catch (e) {} }
  ['user_name', 'user_email', 'user_company', 'user_id', 'access_type', 'login_token', 'remembered_user_id', 'remembered_name', 'remembered_email', 'remembered_access_type', 'remembered_token'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  location.href = 'login.html';
}
function renderSoon(which) {
  const names = { adoption: 'Adoption Overview', reports: 'Reports & Insights', impact: 'Business Impact' };
  const blurb = { adoption: 'See who is using Wisdom on the GO!, how often, and where adoption is growing.', reports: 'Reflector insights, learning friction and more — sliced by your companies and departments.', impact: 'Connect learning to business results.' };
  $('#view').innerHTML = `<div class="um-page-head"><div><h1 class="um-title">${names[which] || 'Coming soon'}</h1></div></div><div class="panel soon-card"><div class="big">Coming soon</div><p>${esc(blurb[which] || '')} Everything here will respect the companies and departments you manage.</p></div>`;
}
async function route() {
  $$('.menu').forEach(x => x.remove());
  const raw = (location.hash || '#users').slice(1), qi = raw.indexOf('?');
  const path = qi === -1 ? raw : raw.slice(0, qi), params = new URLSearchParams(qi === -1 ? '' : raw.slice(qi + 1));
  const parts = path.split('/');
  S.route = parts[0];
  if (parts[0] === 'users') { drawNav('users'); return renderUsers(); }
  if (parts[0] === 'departments') { drawNav('users'); return renderDepartments(); }
  if (parts[0] === 'admins') { drawNav('users'); return renderAdmins(); }
  if (parts[0] === 'bulk') { drawNav('users'); return renderBulk(); }
  if (parts[0] === 'learning') {
    drawNav('learning');
    if (parts[1] === 'initiatives') return renderInitiatives();
    if (parts[1] === 'glossary') return renderGlossary();
    return renderAssign(params);
  }
  if (parts[0] === 'soon') { drawNav(parts[1]); return renderSoon(parts[1]); }
  if (parts[0] === 'adoption') { location.replace('#reports/adoption'); return; }   // Adoption Overview now lives inside Reports & Insights (Kriti, 2026-10-09); old links still land there
  if (parts[0] === 'reports') {
    drawNav('reports');
    if (parts[1] === 'adoption') { renderAdoption(); $('#view .um-page-head > div').insertAdjacentHTML('afterbegin', REPORTS_BACK); return; }
    if (parts[1] === 'friction') return LF.render();
    return renderReportsHub();
  }
  location.hash = '#users';
}
// ── Profile photo + its drop-down (Kriti, 2026-10-03): same behaviour as the user page -- click your photo, the
// menu opens ("Back to chat"); click anywhere else or press Esc and it closes. ──
function toggleProfileMenu(e) {
  e.preventDefault(); e.stopPropagation();
  $('#profileDropdown').classList.toggle('open');
}
document.addEventListener('click', () => { const d = $('#profileDropdown'); if (d) d.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const d = $('#profileDropdown'); if (d) d.classList.remove('open'); } });
// The photo the person uploaded under My Profile on the user page. Its own small fetch, independent of the rest of
// the page (like the user page's header photo): if it fails or there is none, the circle just stays empty.
async function loadProfilePhoto() {
  try {
    const res = await fetch(API_BASE + '/api/my-profile?user_id=' + encodeURIComponent(CURRENT_USER_ID));
    if (!res.ok) return;
    const p = await res.json();
    if (p.photo_base64) { const img = $('#profPhoto'); img.src = 'data:image/jpeg;base64,' + p.photo_base64; img.classList.add('has-photo'); }
  } catch (err) { /* leave the empty circle */ }
}
loadProfilePhoto();

(async function init() {
  $('#burger').onclick = () => {
    if (window.innerWidth <= 960) { $('#adminSidebar').classList.toggle('open'); return; }
    $('#adminSidebar').classList.toggle('collapsed'); $('#adminMain').classList.toggle('expanded');
  };
  try {
    await loadScope();
    S.me = await api('/api/admin/user-lookup?user_id=' + encodeURIComponent(CURRENT_USER_ID));
  } catch (e) {
    $('#view').innerHTML = `<div class="panel soon-card"><div class="big">We couldn’t open the admin area</div><p>${esc(e.message)}</p><p style="margin-top:1rem"><a class="btn-outline" href="chat.html">Back to Wisdom on the GO!</a></p></div>`;
    return;
  }
  const shownName = cleanName(S.me.name);
  $('#helloName').textContent = shownName.split(/\s+/)[0] || 'there';
  $('#profName').textContent = shownName;
  const cos = scopeCompanies().map(c => c.company_name);
  $('#profRole').textContent = (ROLE_LABEL[S.me.access_type] || 'Admin') + (level() === 'super' ? '' : (cos.length ? ' · ' + cos.slice(0, 2).join(', ') + (cos.length > 2 ? ' +' + (cos.length - 2) : '') : ''));
  // Company Settings: only a Company Admin or the super admin may see or change it -- same tier as the
  // department list (Kriti, 2026-10-06). Lives in the profile drop-down, not User Management -- "User
  // Management is about users."
  if (level() === 'company' || level() === 'super') $('#companySettingsRow').classList.remove('hidden');
  window.addEventListener('hashchange', route);
  route();
})();

</script>
